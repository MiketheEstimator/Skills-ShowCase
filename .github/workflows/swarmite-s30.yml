name: Swarmite S30 Continuous Combination
on:
  push:
    paths: ['.github/workflows/swarmite-s30.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Execute frozen S30 stages
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          import swarmite_exp002_s30_mix as s30
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); item=next(x for x in q['queue'] if x['id']=='EXP-002S30')
          item.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S30_CONTINUOUS_COMBINATION_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s30_mix.py','runner_commit':'c85f8381ccd21aa8a4f303657f59a89a776137ef','checkpoint':{'state':'protocol_frozen','next_stage':'training','training_seeds':[71400,71447],'validation_seeds':[71500,71547],'confirmation_seeds':[71600,71695]}}); qp.write_text(json.dumps(q,indent=2))
          train=s30.generate(71400,71447); grid=s30.training_grid(train); T=s30.select_T(grid); Path('EXP-002S30_TRAINING_RESULT.json').write_text(json.dumps({'rows':train,'grid':grid,'selected_T':T},indent=2)); item['training_artifact']='experiments/swarmite-exp002/EXP-002S30_TRAINING_RESULT.json'; item['selected_T']=T
          if T is None:
            disposition='NO_TEMPERATURE_QUALIFIED'; item['status']='COMPLETE_FALSIFIED_AT_TRAINING'; final=None
          else:
            val=s30.generate(71500,71547); vsm=s30.summarize(val,T,seed=23031); vpass=s30.qualifies(vsm); Path('EXP-002S30_VALIDATION_RESULT.json').write_text(json.dumps({'rows':val,'summary':vsm,'passes':vpass},indent=2)); item['validation_artifact']='experiments/swarmite-exp002/EXP-002S30_VALIDATION_RESULT.json'
            if not vpass:
              disposition='FROZEN_MIX_FAILED_VALIDATION'; item['status']='COMPLETE_FALSIFIED_ON_VALIDATION'; final=vsm
            else:
              conf=s30.generate(71600,71695); csm=s30.summarize(conf,T,seed=23032); cpass=s30.qualifies_confirmation(csm); Path('EXP-002S30_CONFIRMATION_RESULT.json').write_text(json.dumps({'rows':conf,'summary':csm,'passes':cpass},indent=2)); item['result_artifact']='experiments/swarmite-exp002/EXP-002S30_CONFIRMATION_RESULT.json'; item['result_summary']=csm; final=csm
              disposition='CONTINUOUS_COMBINATION_SUPPORTED' if cpass else 'FROZEN_MIX_FAILED_CONFIRMATION'; item['status']='COMPLETE_SUPPORTED' if cpass else 'COMPLETE_FALSIFIED_ON_CONFIRMATION'
          item['checkpoint']={'state':'complete','disposition':disposition}
          if not any(x.get('id')=='EXP-002S31' for x in q['queue']):
            if disposition=='CONTINUOUS_COMBINATION_SUPPORTED': title='Continuous science-posterior combination transfer stress'; rationale='S30 supported ADEQ-weighted posterior combination; test the frozen mixing rule on unseen mechanism/noise families before promotion to reference architecture.'
            else: title='Terminal model-set insufficiency diagnostic'; rationale='S30 failed despite soft combination of baseline and robust posteriors; diagnose whether the two-posterior model set lacks a needed mechanism class before any further weighting-rule tuning.'
            q['queue'].append({'id':'EXP-002S31','title':title,'priority':53.25,'status':'PENDING','depends_on':['EXP-002S30'],'rationale':rationale})
          finding=f"S30 {disposition}: ADEQ-weighted continuous posterior combination evaluated on separated fresh worlds."
          if finding not in q['established_findings']: q['established_findings'].append(finding)
          q['version']='6.5'; qp.write_text(json.dumps(q,indent=2))
          lines=['# EXP-002S30 Evaluation','',f'**Disposition:** {disposition}','',f'**Selected T:** {T}']
          if final is not None:
            lines += ['',f"Overall edge delta {final['mean_edge_delta']:.6f}; CI {final['bootstrap95_edge_delta']}; Brier {final['mean_brier_delta']:.6f}; harms {final['large_harms']}; mean alpha {final['mean_alpha']:.3f}.",'','## By regime']
            for reg,v in final['by_regime'].items(): lines.append(f"- **{reg}**: edge {v['mean_edge_delta']:.6f}, CI {v['bootstrap95_edge_delta']}, Brier {v['mean_brier_delta']:.6f}, alpha {v['mean_alpha']:.3f}, harms {v['large_harms']}")
          lines += ['','## Next',next(x['rationale'] for x in q['queue'] if x['id']=='EXP-002S31')]; Path('EXP-002S30_EVALUATION.md').write_text('\n'.join(lines)); item['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S30_EVALUATION.md'; qp.write_text(json.dumps(q,indent=2))
          PY
      - name: Persist result
        run: |
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-exp002/EXP-002S30_* experiments/swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Run EXP-002S30 continuous posterior combination'
          git push
