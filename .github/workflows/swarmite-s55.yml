name: Swarmite S55 Residual Process Class Posterior
on:
  push:
    paths: ['.github/workflows/swarmite-s55.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Start S55
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          qp=Path('experiments/swarmite-queue/QUEUE.json'); q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S55')
          it.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S55_RESIDUAL_PROCESS_CLASS_POSTERIOR_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s55_residual_process_class_posterior.py','checkpoint':{'state':'protocol_frozen','next_stage':'mechanics','mechanics':'2 linear + 2 heteroskedastic','training':'64 + 64','validation':'32 + 32','confirmation':'64 + 64'}})
          q['version']='10.4'; qp.write_text(json.dumps(q,indent=2))
          PY
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Start EXP-002S55 explicit class posterior'
          git push
      - name: Mechanics
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s55_residual_process_class_posterior as s55
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S55')
          rows=s55.generate(84501,2); ok=s55.mechanics(rows,2)
          Path('EXP-002S55_MECHANICS_RESULT.json').write_text(json.dumps({'passed':ok,'rows':rows},indent=2)); it['mechanics_artifact']='experiments/swarmite-exp002/EXP-002S55_MECHANICS_RESULT.json'
          it['checkpoint']={'state':'mechanics_passed','next_stage':'training'} if ok else {'state':'blocked_mechanics','next_action':'repair S55 mechanics without exposing training'}
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S55_MECHANICS_RESULT.json ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Persist EXP-002S55 mechanics gate'
          git push
      - name: Training
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s55_residual_process_class_posterior as s55
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S55')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='mechanics_passed': raise SystemExit(0)
          rows=s55.generate(84601,64); ok=s55.mechanics(rows,64); model=s55.train_model(rows) if ok else None; ev=s55.evaluate(rows,model,25555) if ok else None
          Path('EXP-002S55_TRAINING_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'model':model,'evaluation':ev},indent=2)); it['training_artifact']='experiments/swarmite-exp002/EXP-002S55_TRAINING_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_training_mechanics','next_action':'repair without validation exposure'}
          elif not s55.qualifies(ev): it['status']='COMPLETE_FALSIFIED_AT_TRAINING'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_AT_TRAINING','training':ev}
          else: it['checkpoint']={'state':'training_passed','next_stage':'validation','model':model,'training':ev}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S55_TRAINING_RESULT.json ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Persist EXP-002S55 training gate'
          git push
      - name: Validation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s55_residual_process_class_posterior as s55
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S55')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='training_passed': raise SystemExit(0)
          model=it['checkpoint']['model']; rows=s55.generate(85001,32); ok=s55.mechanics(rows,32); ev=s55.evaluate(rows,model,25556) if ok else None
          Path('EXP-002S55_VALIDATION_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':ev},indent=2)); it['validation_artifact']='experiments/swarmite-exp002/EXP-002S55_VALIDATION_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_validation_mechanics','next_action':'repair without confirmation exposure'}
          elif not s55.qualifies(ev,validation=True): it['status']='COMPLETE_FALSIFIED_ON_VALIDATION'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_ON_VALIDATION','validation':ev}
          else: it['checkpoint']={'state':'validation_passed','next_stage':'confirmation','model':model,'validation':ev}
          qp.write_text(json.dumps(q,indent=2))
          PY
          if [ -f EXP-002S55_VALIDATION_RESULT.json ]; then git add EXP-002S55_VALIDATION_RESULT.json ../swarmite-queue/QUEUE.json; fi
          git diff --cached --quiet || git commit -m 'Persist EXP-002S55 validation gate'
          git push
      - name: Confirmation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s55_residual_process_class_posterior as s55
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S55')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='validation_passed': raise SystemExit(0)
          model=it['checkpoint']['model']; rows=s55.generate(85501,64); ok=s55.mechanics(rows,64); ev=s55.evaluate(rows,model,25557) if ok else None
          Path('EXP-002S55_CONFIRMATION_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':ev},indent=2)); it['result_artifact']='experiments/swarmite-exp002/EXP-002S55_CONFIRMATION_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_confirmation_mechanics','next_action':'repair confirmation mechanics'}
          elif s55.qualifies(ev,validation=True,confirmation=True): it['status']='COMPLETE_SUPPORTED'; it['checkpoint']={'state':'complete','disposition':'SUPPORTED'}; it['result_summary']=ev
          else: it['status']='COMPLETE_FALSIFIED_ON_CONFIRMATION'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_ON_CONFIRMATION','confirmation':ev}
          qp.write_text(json.dumps(q,indent=2))
          PY
          if [ -f EXP-002S55_CONFIRMATION_RESULT.json ]; then git add EXP-002S55_CONFIRMATION_RESULT.json ../swarmite-queue/QUEUE.json; fi
          git diff --cached --quiet || git commit -m 'Persist EXP-002S55 confirmation'
          git push
      - name: Evaluate and enqueue S56
        if: always()
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S55'); disp=it.get('checkpoint',{}).get('disposition')
          if not disp: qp.write_text(json.dumps(q,indent=2)); raise SystemExit(0)
          tr=json.loads(Path('EXP-002S55_TRAINING_RESULT.json').read_text()) if Path('EXP-002S55_TRAINING_RESULT.json').exists() else {}; ev=tr.get('evaluation') or {}
          if disp=='SUPPORTED': title='S55 breadth transfer without retuning'; rationale='S55 supported explicit residual-process class marginalization. Freeze it and test breadth across weak-effect, nonlinear/heavy-tail, topology, joint, and heteroskedastic regimes without retuning.'
          elif ev.get('node_specialist_win_auc') is not None and ev.get('node_specialist_win_auc')>=.60: title='Continuous residual-process likelihood family'; rationale='S55 retained observable class discrimination but explicit binary residual-class marginalization did not qualify. Replace the binary A/H residual class with a continuous variance-process likelihood; do not retune S55 class probabilities.'
          else: title='Residual-state representation expansion'; rationale='S55 did not preserve adequate prospective nodewise class discrimination. Expand observable residual-state representation before attempting another terminal mixture mechanism.'
          sid='EXP-002S56'
          if not any(x.get('id')==sid for x in q['queue']): q['queue'].append({'id':sid,'title':title,'priority':47.0,'status':'PENDING','depends_on':['EXP-002S55'],'rationale':rationale})
          finding=f'S55 disposition {disp}. Explicit posterior uncertainty over nodewise residual-process classes was tested prospectively against the frozen S46/S30 matched control with planning unchanged.'
          if ev: finding += f" Training paired edge difference {ev.get('paired_mean_edge_difference')}, node AUC {ev.get('node_specialist_win_auc')}, node Brier {ev.get('node_specialist_win_brier')}, mean H-class mass {ev.get('mean_heteroskedastic_class_mass')}."
          if finding not in q['established_findings']: q['established_findings'].append(finding)
          Path('EXP-002S55_EVALUATION.md').write_text('# EXP-002S55 Evaluation\n\n**Disposition:** '+disp+'\n\n'+finding+'\n\n## Next\n'+rationale+'\n'); it['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S55_EVALUATION.md'; q['version']='10.5'; qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S55_EVALUATION.md ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Evaluate EXP-002S55 and enqueue successor'
          git push
