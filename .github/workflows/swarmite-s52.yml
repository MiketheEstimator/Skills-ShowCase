name: Swarmite S52 Latent Residual-State Adjudication
on:
  push:
    paths: ['.github/workflows/swarmite-s52.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Start S52
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('experiments/swarmite-queue/QUEUE.json'); q=json.loads(p.read_text())
          it=next(x for x in q['queue'] if x.get('id')=='EXP-002S52')
          it.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S52_LATENT_RESIDUAL_STATE_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s52_latent_residual_state.py','runner_commit':'38625836aa2d81e018609ce9be9c5b6d5c7e8a92','checkpoint':{'state':'protocol_frozen','next_stage':'mechanics','mechanics':'2 linear + 2 heteroskedastic','training':'64 + 64','validation':'32 + 32','confirmation':'64 + 64'}})
          q['version']='9.8'; p.write_text(json.dumps(q,indent=2))
          PY
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Start EXP-002S52 latent residual-state adjudication'
          git push
      - name: Mechanics
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s52_latent_residual_state as s52
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S52')
          rows=s52.generate(79001,2); ok=s52.mechanics(rows,2)
          Path('EXP-002S52_MECHANICS_RESULT.json').write_text(json.dumps({'passed':ok,'rows':rows},indent=2)); it['mechanics_artifact']='experiments/swarmite-exp002/EXP-002S52_MECHANICS_RESULT.json'
          if ok: it['checkpoint']={'state':'mechanics_passed','next_stage':'training'}
          else: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_mechanics','next_action':'repair S52 mechanics without exposing training'}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S52_MECHANICS_RESULT.json ../swarmite-queue/QUEUE.json
          git commit -m 'Persist EXP-002S52 mechanics gate'
          git push
      - name: Training
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s52_latent_residual_state as s52
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S52')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='mechanics_passed': raise SystemExit(0)
          rows=s52.generate(79101,64); ok=s52.mechanics(rows,64); model=s52.train_model(rows) if ok else None; rule,grid=s52.select_rule(rows,model) if ok else (None,[])
          out={'mechanics_ok':ok,'model':model,'selected_rule':rule,'grid':grid}
          Path('EXP-002S52_TRAINING_RESULT.json').write_text(json.dumps(out,indent=2)); it['training_artifact']='experiments/swarmite-exp002/EXP-002S52_TRAINING_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_training_mechanics','next_action':'repair mechanics without validation exposure'}
          elif rule is None: it['status']='COMPLETE_FALSIFIED_AT_TRAINING'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_AT_TRAINING'}
          else: it['checkpoint']={'state':'training_passed','next_stage':'validation','selected_rule':rule,'model':model}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S52_TRAINING_RESULT.json ../swarmite-queue/QUEUE.json
          git commit -m 'Persist EXP-002S52 training gate'
          git push
      - name: Validation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s52_latent_residual_state as s52
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S52')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='training_passed': raise SystemExit(0)
          ck=it['checkpoint']; rows=s52.generate(79601,32); ok=s52.mechanics(rows,32); ev=s52.evaluate(rows,ck['model'],ck['selected_rule'],ck['selected_rule']['p_cut'],ck['selected_rule']['gain_cut'],25254) if ok else None
          summary={k:v for k,v in ev.items() if k!='rows'} if ev else None; Path('EXP-002S52_VALIDATION_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':summary},indent=2)); it['validation_artifact']='experiments/swarmite-exp002/EXP-002S52_VALIDATION_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_validation_mechanics','next_action':'repair without confirmation exposure'}
          elif not s52.qualifies(ev,validation=True): it['status']='COMPLETE_FALSIFIED_ON_VALIDATION'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_ON_VALIDATION','validation':summary}
          else: it['checkpoint']={'state':'validation_passed','next_stage':'confirmation','selected_rule':ck['selected_rule'],'model':ck['model'],'validation':summary}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S52_VALIDATION_RESULT.json ../swarmite-queue/QUEUE.json
          git commit -m 'Persist EXP-002S52 validation gate'
          git push
      - name: Confirmation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s52_latent_residual_state as s52
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S52')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='validation_passed': raise SystemExit(0)
          ck=it['checkpoint']; rows=s52.generate(79901,64); ok=s52.mechanics(rows,64); ev=s52.evaluate(rows,ck['model'],ck['selected_rule'],ck['selected_rule']['p_cut'],ck['selected_rule']['gain_cut'],25255) if ok else None
          summary={k:v for k,v in ev.items() if k!='rows'} if ev else None; Path('EXP-002S52_CONFIRMATION_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':summary},indent=2)); it['result_artifact']='experiments/swarmite-exp002/EXP-002S52_CONFIRMATION_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_confirmation_mechanics','next_action':'repair confirmation mechanics'}
          elif s52.qualifies(ev,validation=True,confirmation=True): it['status']='COMPLETE_SUPPORTED'; it['checkpoint']={'state':'complete','disposition':'SUPPORTED'}; it['result_summary']=summary
          else: it['status']='COMPLETE_FALSIFIED_ON_CONFIRMATION'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_ON_CONFIRMATION','confirmation':summary}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S52_CONFIRMATION_RESULT.json ../swarmite-queue/QUEUE.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Persist EXP-002S52 confirmation'
          git push
      - name: Evaluate and enqueue S53
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S52'); disp=it.get('checkpoint',{}).get('disposition')
          tr=json.loads(Path('EXP-002S52_TRAINING_RESULT.json').read_text()) if Path('EXP-002S52_TRAINING_RESULT.json').exists() else {}
          va=json.loads(Path('EXP-002S52_VALIDATION_RESULT.json').read_text()) if Path('EXP-002S52_VALIDATION_RESULT.json').exists() else {}
          co=json.loads(Path('EXP-002S52_CONFIRMATION_RESULT.json').read_text()) if Path('EXP-002S52_CONFIRMATION_RESULT.json').exists() else {}
          if disp:
              if disp=='SUPPORTED':
                  title='Latent residual-state breadth transfer'; rationale='S52 supported richer residual-state adjudication on held-out linear and heteroskedastic worlds. Freeze the model and rule and test transfer across weak-effect, compound nonlinear/heavy-tail, topology, joint, and heteroskedastic regimes without retuning.'
              else:
                  ev=(co.get('evaluation') or va.get('evaluation') or {})
                  auc=ev.get('specialist_win_auc')
                  if auc is not None and auc<.60:
                      title='Nodewise latent residual-mixture representation'; rationale='S52 failed with inadequate specialist-win discrimination despite S51 oracle headroom. Replace aggregated residual summaries with a nodewise latent mixture/variance-process embedding; do not retune S52 cutoffs.'
                  else:
                      title='Calibrated residual-state terminal model averaging'; rationale='S52 residual-state discrimination was not the dominant failure, but hard specialist selection failed terminal quality/calibration. Replace hard selection with a newly preregistered calibrated model-average while preserving planning and S30 anchor.'
              if not any(x.get('id')=='EXP-002S53' for x in q['queue']): q['queue'].append({'id':'EXP-002S53','title':title,'priority':47.75,'status':'PENDING','depends_on':['EXP-002S52'],'rationale':rationale})
              finding='S52 disposition '+str(disp)+'. Rich cross-fitted residual-state adjudication was tested prospectively against frozen S46/S30 with planning unchanged.'
              if it.get('result_summary'):
                  rs=it['result_summary']; finding += f" Confirmation paired edge difference {rs.get('paired_mean_edge_difference')}, 95% bootstrap {rs.get('bootstrap95_paired_edge_difference')}, specialist-win AUC {rs.get('specialist_win_auc')}."
              elif va.get('evaluation'):
                  rs=va['evaluation']; finding += f" Validation paired edge difference {rs.get('paired_mean_edge_difference')}, specialist-win AUC {rs.get('specialist_win_auc')}."
              if finding not in q['established_findings']: q['established_findings'].append(finding)
              Path('EXP-002S52_EVALUATION.md').write_text('# EXP-002S52 Evaluation\n\n**Disposition:** '+str(disp)+'\n\n'+finding+'\n\n## Next\n'+rationale+'\n')
              it['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S52_EVALUATION.md'
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S52_EVALUATION.md ../swarmite-queue/QUEUE.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Evaluate EXP-002S52 and enqueue successor'
          git push
