name: Swarmite S42 Finalize
on:
  push:
    paths: ['.github/workflows/swarmite-s42-finalize.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Execute and persist EXP-002S42
        working-directory: experiments/swarmite-exp002
        run: python finalize_exp002_s42.py
      - name: Commit scientific state
        run: |
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-exp002/EXP-002S42_RESULT.json experiments/swarmite-exp002/EXP-002S42_EVALUATION.md experiments/swarmite-queue/QUEUE.json
          git commit -m 'Complete EXP-002S42 topology world-class diagnostic'
          git push
