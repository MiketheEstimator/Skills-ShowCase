name: Swarmite S60 Counterfactual Predictive Residual-State Diagnostic
on:
  push:
    paths: ['.github/workflows/swarmite-s60.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Start S60
        run: |
          git pull --rebase
          python - <<'PY'
          import json
          from pathlib import Path
          qp=Path('experiments/swarmite-queue/QUEUE.json'); q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S60')
          if it.get('status')=='PENDING':
              it.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S60_COUNTERFACTUAL_PREDICTIVE_RESIDUAL_STATE_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s60_counterfactual_predictive_residual_state.py','checkpoint':{'state':'protocol_frozen','next_stage':'mechanics','mechanics':'2 linear + 2 heteroskedastic','diagnostic':'64 + 64'}})
              q['version']='11.4'
          qp.write_text(json.dumps(q,indent=2))
          PY
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Start EXP-002S60 predictive-state diagnostic'
          git push
      - name: Mechanics
        working-directory: experiments/swarmite-exp002
        run: |
          git pull --rebase
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s60_counterfactual_predictive_residual_state as s60
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S60')
          if it.get('status')!='RUNNING': raise SystemExit(0)
          rows=s60.generate(93001,2); ok=s60.mechanics(rows,2)
          Path('EXP-002S60_MECHANICS_RESULT.json').write_text(json.dumps({'passed':ok,'rows':rows},indent=2)); it['mechanics_artifact']='experiments/swarmite-exp002/EXP-002S60_MECHANICS_RESULT.json'
          if ok: it['checkpoint']={'state':'mechanics_passed','next_stage':'diagnostic'}
          else: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_mechanics','next_action':'repair S60 predictive-state mechanics without exposing diagnostic panel'}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S60_MECHANICS_RESULT.json ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Persist EXP-002S60 mechanics gate'
          git push
      - name: Diagnostic panel
        working-directory: experiments/swarmite-exp002
        run: |
          git pull --rebase
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s60_counterfactual_predictive_residual_state as s60
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S60')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='mechanics_passed': raise SystemExit(0)
          rows=s60.generate(93101,64); ok=s60.mechanics(rows,64); ev=s60.evaluate(rows) if ok else None; disp=s60.disposition(ev) if ok else 'BLOCKED_MECHANICS'
          Path('EXP-002S60_DIAGNOSTIC_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':ev,'disposition':disp,'node_rows':rows},indent=2)); it['result_artifact']='experiments/swarmite-exp002/EXP-002S60_DIAGNOSTIC_RESULT.json'
          if not ok:
              it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_diagnostic_mechanics','next_action':'repair S60 diagnostic mechanics'}
          else:
              it['status']='COMPLETE_DIAGNOSTIC_SUPPORTED' if disp=='PREDICTIVE_STATE_ALIGNED' else ('COMPLETE_DIAGNOSTIC_PARTIAL' if disp=='PREDICTIVE_STATE_WEAK_SIGNAL' else 'COMPLETE_DIAGNOSTIC_FALSIFIED')
              it['checkpoint']={'state':'complete','disposition':disp,'diagnostic':ev}; it['result_summary']=ev
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S60_DIAGNOSTIC_RESULT.json ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Persist EXP-002S60 diagnostic result'
          git push
      - name: Evaluate and enqueue S61
        if: always()
        working-directory: experiments/swarmite-exp002
        run: |
          git pull --rebase
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S60'); disp=it.get('checkpoint',{}).get('disposition')
          if not disp: qp.write_text(json.dumps(q,indent=2)); raise SystemExit(0)
          ev=it.get('checkpoint',{}).get('diagnostic') or {}; sid='EXP-002S61'
          if disp=='PREDICTIVE_STATE_ALIGNED':
              title='Bounded predictive-state targeted structural correction'
              rationale='S60 found intervention-state counterfactual predictive behavior reliably localizes frozen anchor family-ranking errors. Prospectively fit a bounded targeted correction or abstention using only frozen S60 features, with independent training, validation, and confirmation panels against S46/S30.'
          elif disp=='PREDICTIVE_STATE_WEAK_SIGNAL':
              title='Interaction-aware intervention-state predictive geometry diagnostic'
              rationale='S60 found partial predictive-state error-localization signal but not enough reliability for a policy. Enrich the representation with state-by-parent-family interaction contrasts and ranking geometry; do not tune S60 thresholds.'
          else:
              title='Intervention-conditioned posterior family-disagreement diagnostic'
              rationale='S60 falsified simple counterfactual predictive instability as a structural error locator. Change representation to posterior family disagreement under intervention-conditioned refits rather than retuning S60 loss summaries.'
          if not any(x.get('id')==sid for x in q['queue']): q['queue'].append({'id':sid,'title':title,'priority':42.5,'status':'PENDING','depends_on':['EXP-002S60'],'rationale':rationale})
          finding=f"S60 disposition {disp}. Best counterfactual predictive-state AUC for frozen anchor parent-ranking errors {ev.get('best_auc')}; bootstrap95 {ev.get('best_auc_bootstrap95')}; best feature {ev.get('best_feature')}; mean CV states {ev.get('mean_cv_states')}."
          if finding not in q['established_findings']: q['established_findings'].append(finding)
          Path('EXP-002S60_EVALUATION.md').write_text('# EXP-002S60 Evaluation\n\n**Disposition:** '+str(disp)+'\n\n'+finding+'\n\n## Next\n'+rationale+'\n'); it['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S60_EVALUATION.md'; q['version']='11.5'; qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S60_EVALUATION.md ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Evaluate EXP-002S60 and enqueue successor'
          git push
