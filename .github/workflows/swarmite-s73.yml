name: Swarmite S73 Set-Valued Acquisition
on:
  push:
    paths: ['.github/workflows/swarmite-s73.yml']
permissions: {contents: write}
jobs:
 run:
  runs-on: ubuntu-latest
  timeout-minutes: 240
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: '3.11'}
   - run: pip install numpy
   - name: Start S73
     run: |
      git pull --rebase
      python - <<'PY'
      import json
      from pathlib import Path
      p=Path('experiments/swarmite-queue/QUEUE.json'); q=json.loads(p.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S73')
      if it['status']=='PENDING':
       it.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S73_SET_VALUED_ACQUISITION_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s73_set_valued_acquisition.py','checkpoint':{'state':'protocol_frozen','next_stage':'mechanics_diagnostic'}}); q['version']='14.0'; p.write_text(json.dumps(q,indent=2))
      PY
      git config user.name swarmite-worker; git config user.email swarmite-worker@users.noreply.github.com; git add experiments/swarmite-queue/QUEUE.json; git diff --cached --quiet || git commit -m 'Start EXP-002S73 set-valued acquisition'; git push
   - name: Execute and evaluate S73
     working-directory: experiments/swarmite-exp002
     run: |
      git pull --rebase
      python swarmite_exp002_s73_set_valued_acquisition.py > EXP-002S73_RESULT.json
      python - <<'PY'
      import json
      from pathlib import Path
      root=Path('../..'); p=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(p.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S73'); z=json.loads(Path('EXP-002S73_RESULT.json').read_text()); d=z.get('disposition','BLOCKED_EXECUTION_UNKNOWN')
      it['result_artifact']='experiments/swarmite-exp002/EXP-002S73_RESULT.json'; it['result_summary']=z.get('diagnostic',{}); it['checkpoint']={'state':'blocked' if d.startswith('BLOCKED') else 'complete','disposition':d}; it['status']=('BLOCKED_'+d.removeprefix('BLOCKED_')) if d.startswith('BLOCKED') else 'COMPLETE_'+d
      if not d.startswith('BLOCKED'):
       if d=='SET_VALUED_ACQUISITION_SUPPORTED': title='Frozen set-valued acquisition planner policy test'; rationale='S73 supported empirical structural-outcome family utility. Freeze S73 score and test a resource-matched prospective planner policy against EIG without retuning.'
       elif d=='SET_VALUED_ACQUISITION_WEAK': title='Distributional ambiguity acquisition utility diagnostic'; rationale='S73 retained weak signal but failed promotion. Preserve empirical structural families and test explicit downside/ambiguity utility rather than retuning the S73 quantile.'
       else: title='Observed intervention-response acquisition model diagnostic'; rationale='S73 falsified posterior-predictive structural-family acquisition utility after S67/S68 and S70-S72 failures. Abandon posterior-predictive branch summaries and learn acquisition value directly from accumulated observable intervention-response transitions.'
       if not any(x.get('id')=='EXP-002S74' for x in q['queue']): q['queue'].append({'id':'EXP-002S74','title':title,'priority':39.6,'status':'PENDING','depends_on':['EXP-002S73'],'rationale':rationale})
       finding=f"S73 disposition {d}. Set-valued structural-family acquisition diagnostic: {z.get('diagnostic')}."; q['established_findings'].append(finding) if finding not in q['established_findings'] else None
       Path('EXP-002S73_EVALUATION.md').write_text('# EXP-002S73 Evaluation\n\n**Disposition:** '+d+'\n\n'+finding+'\n\n## Next\n'+rationale+'\n'); it['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S73_EVALUATION.md'
      q['version']='14.1'; p.write_text(json.dumps(q,indent=2))
      PY
      git add EXP-002S73_RESULT.json EXP-002S73_EVALUATION.md ../swarmite-queue/QUEUE.json 2>/dev/null || git add EXP-002S73_RESULT.json ../swarmite-queue/QUEUE.json; git diff --cached --quiet || git commit -m 'Complete EXP-002S73 and enqueue successor'; git push
