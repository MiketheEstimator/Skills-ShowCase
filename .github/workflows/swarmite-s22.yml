name: Swarmite S22 Robust Aggregation
on:
  push:
    paths: ['.github/workflows/swarmite-s22.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Execute frozen S22 sequence
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s22_robust_pool as s22
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); item=next(x for x in q['queue'] if x['id']=='EXP-002S22')
          item.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S22_ROBUST_MODEL_AGGREGATION_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s22_robust_pool.py','checkpoint':{'state':'protocol_frozen','next_stage':'training','training_seeds':list(range(70101,70125))}}); qp.write_text(json.dumps(q,indent=2))
          tr=[s22.row(s) for s in range(70101,70125)]; grid,sel=s22.train(tr); Path('EXP-002S22_TRAINING_RESULT.json').write_text(json.dumps({'rows':tr,'grid':grid,'selected':sel},indent=2)); item['training_artifact']='experiments/swarmite-exp002/EXP-002S22_TRAINING_RESULT.json'
          if sel is None:
              disposition='FALSIFIED_AT_TRAINING'; item['status']='COMPLETE_FALSIFIED_AT_TRAINING'; item['result_summary']={'training_grid':grid}; va=[]; co=[]; vs=None; cs=None; ci=None
          else:
              tau=sel['tau']; item['selected_tau']=tau; item['checkpoint']={'state':'training_complete_tau_frozen','selected_tau':tau,'next_stage':'validation','validation_seeds':list(range(70201,70225))}; qp.write_text(json.dumps(q,indent=2))
              va=[s22.row(s) for s in range(70201,70225)]; vs=s22.summarize(va,tau); Path('EXP-002S22_VALIDATION_RESULT.json').write_text(json.dumps({'tau':tau,'rows':va,'summary':vs},indent=2)); item['validation_artifact']='experiments/swarmite-exp002/EXP-002S22_VALIDATION_RESULT.json'
              vpass=bool(vs['mean_edge_delta']<=-.10 and vs['mean_brier_delta']<=.005 and vs['large_harms']<=3 and vs['trace_identical_all'] and vs['dag_count_ok'] and vs['spend_ok'] and vs['normalized'])
              if not vpass:
                  disposition='FALSIFIED_ON_VALIDATION'; item['status']='COMPLETE_FALSIFIED_ON_VALIDATION'; item['result_summary']=vs; co=[]; cs=None; ci=None
              else:
                  item['checkpoint']={'state':'validation_passed','selected_tau':tau,'validation_summary':vs,'next_stage':'heldout_confirmation','confirmation_seeds':list(range(70301,70349))}; qp.write_text(json.dumps(q,indent=2))
                  co=[s22.row(s) for s in range(70301,70349)]; cs=s22.summarize(co,tau); ci=s22.bootstrap(co,tau); Path('EXP-002S22_CONFIRMATION_RESULT.json').write_text(json.dumps({'tau':tau,'rows':co,'summary':cs,'bootstrap95_edge_delta':ci},indent=2)); item['result_artifact']='experiments/swarmite-exp002/EXP-002S22_CONFIRMATION_RESULT.json'
                  cpass=bool(cs['mean_edge_delta']<=-.10 and ci[1]<0 and cs['mean_brier_delta']<=.005 and cs['large_harms']<=5 and cs['trace_identical_all'] and cs['dag_count_ok'] and cs['spend_ok'] and cs['normalized'])
                  disposition='SUPPORTED' if cpass else 'FALSIFIED_ON_CONFIRMATION'; item['status']='COMPLETE_SUPPORTED' if cpass else 'COMPLETE_FALSIFIED_ON_CONFIRMATION'; item['result_summary']={**cs,'bootstrap95_edge_delta':ci}
          item['checkpoint']={'state':'complete','disposition':disposition}
          if not any(x.get('id')=='EXP-002S23' for x in q['queue']):
              if disposition=='SUPPORTED': title='Robust aggregation transfer under unseen shift'; rationale='S22 supported tempered evidence pooling; test the frozen temperature under a new nonlinear/noise mechanism shift without retuning.'
              elif disposition=='FALSIFIED_AT_TRAINING': title='Heavy-tail nonlinear structural likelihood class'; rationale='No evidence temperature could rescue the represented class set on training; add a materially different heavy-tail nonlinear likelihood class.'
              else: title='Posterior aggregation representation diagnostic'; rationale='Tempered evidence pooling failed prospectively; compare DAG-posterior pooling with edge-marginal robust aggregation before adding further classes.'
              q['queue'].append({'id':'EXP-002S23','title':title,'priority':55.25,'status':'PENDING','depends_on':['EXP-002S22'],'rationale':rationale})
          q['version']='5.7'; finding=f"S22 {disposition}: robust model-class evidence tempering disposition recorded with frozen training/validation/confirmation separation."; q['established_findings'].append(finding) if finding not in q['established_findings'] else None; qp.write_text(json.dumps(q,indent=2))
          lines=['# EXP-002S22 Evaluation','',f'**Disposition:** {disposition}','']
          if sel: lines += [f"- Selected evidence temperature: {sel['tau']}",f"- Training edge delta: {sel['mean_edge_delta']:.6f}",f"- Training Brier delta: {sel['mean_brier_delta']:.6f}",f"- Training mean weights: {sel['mean_class_weights']}",'']
          if vs: lines += ['## Validation',f"- Mean edge delta: {vs['mean_edge_delta']:.6f}",f"- Mean Brier delta: {vs['mean_brier_delta']:.6f}",f"- Large harms: {vs['large_harms']}",f"- Mean weights: {vs['mean_class_weights']}",'']
          if cs: lines += ['## Confirmation',f"- Mean edge delta: {cs['mean_edge_delta']:.6f}",f"- Bootstrap 95% edge CI: {ci}",f"- Mean Brier delta: {cs['mean_brier_delta']:.6f}",f"- Large harms: {cs['large_harms']}",f"- Mean weights: {cs['mean_class_weights']}",'']
          lines += ['## Next',next(x['rationale'] for x in q['queue'] if x['id']=='EXP-002S23')]; Path('EXP-002S22_EVALUATION.md').write_text('\n'.join(lines)); item['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S22_EVALUATION.md'; qp.write_text(json.dumps(q,indent=2))
          PY
      - name: Persist result
        run: |
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-exp002/EXP-002S22_* experiments/swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Complete EXP-002S22 robust aggregation'
          git push
