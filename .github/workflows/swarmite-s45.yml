name: Swarmite S45 Joint Latent Class
on:
  push:
    paths: ['.github/workflows/swarmite-s45.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Persist RUNNING protocol checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          qp=Path('experiments/swarmite-queue/QUEUE.json'); q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S45')
          it.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S45_JOINT_LATENT_CLASS_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s45_joint_latent.py','runner_commit':'e6d1f308dc5aada09d1ac06f1bf37bafb5566c0b','checkpoint':{'state':'protocol_frozen','next_stage':'training','training_seeds':[73501,73572],'validation_seeds':[73601,73636],'confirmation_seeds':[73701,73772]}}); qp.write_text(json.dumps(q,indent=2))
          PY
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-queue/QUEUE.json
          git commit -m 'Start EXP-002S45 joint latent-class decision'
          git push
      - name: Training and freeze
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s45_joint_latent as s45
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S45')
          tr=s45.generate(73501,73572); T,grid=s45.select_temp(tr); params=s45.fit_utilities(tr); ok=s45.mechanics(tr) and s45.counts_ok(tr,12)
          art={'rows':tr,'selected_T':T,'temperature_grid':grid,'cell_utilities':params,'mechanics_ok':s45.mechanics(tr),'counts_ok':s45.counts_ok(tr,12)}; Path('EXP-002S45_TRAINING_RESULT.json').write_text(json.dumps(art,indent=2))
          it['training_artifact']='experiments/swarmite-exp002/EXP-002S45_TRAINING_RESULT.json'; it['selected_T']=T; it['cell_utilities']=params
          if ok: it['checkpoint']={'state':'training_frozen','next_stage':'validation','selected_T':T}
          else: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_training_mechanics','next_action':'diagnose mechanics without exposing validation'}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S45_TRAINING_RESULT.json ../swarmite-queue/QUEUE.json
          git commit -m 'Persist EXP-002S45 frozen training state'
          git push
      - name: Validation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s45_joint_latent as s45
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S45')
          if it['status']!='RUNNING' or it.get('checkpoint',{}).get('state')!='training_frozen': raise SystemExit(0)
          tr=json.loads(Path('EXP-002S45_TRAINING_RESULT.json').read_text()); T=tr['selected_T']; params=tr['cell_utilities']; va=s45.generate(73601,73636); vs=s45.summarize(va,T,params,24546); ok=s45.counts_ok(va,6) and s45.validation_pass(vs)
          Path('EXP-002S45_VALIDATION_RESULT.json').write_text(json.dumps({'summary':vs,'passes':ok},indent=2)); it['validation_artifact']='experiments/swarmite-exp002/EXP-002S45_VALIDATION_RESULT.json'
          if ok: it['checkpoint']={'state':'validation_passed','next_stage':'heldout_confirmation'}
          else: it['status']='COMPLETE_FALSIFIED_ON_VALIDATION'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_ON_VALIDATION'}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S45_VALIDATION_RESULT.json ../swarmite-queue/QUEUE.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Persist EXP-002S45 validation disposition'
          git push
      - name: Held-out confirmation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s45_joint_latent as s45
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S45')
          if it['status']!='RUNNING' or it.get('checkpoint',{}).get('state')!='validation_passed': raise SystemExit(0)
          tr=json.loads(Path('EXP-002S45_TRAINING_RESULT.json').read_text()); T=tr['selected_T']; params=tr['cell_utilities']; co=s45.generate(73701,73772); cs=s45.summarize(co,T,params,24547); ok=s45.counts_ok(co,12) and s45.confirmation_pass(cs)
          Path('EXP-002S45_CONFIRMATION_RESULT.json').write_text(json.dumps({'summary':cs,'passes':ok},indent=2)); it['result_artifact']='experiments/swarmite-exp002/EXP-002S45_CONFIRMATION_RESULT.json'; it['result_summary']={k:v for k,v in cs.items() if k!='rows'}; it['status']='COMPLETE_SUPPORTED' if ok else 'COMPLETE_FALSIFIED_ON_CONFIRMATION'; it['checkpoint']={'state':'complete','disposition':'JOINT_LATENT_CLASS_SUPPORTED' if ok else 'FALSIFIED_ON_CONFIRMATION'}; qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S45_CONFIRMATION_RESULT.json ../swarmite-queue/QUEUE.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Persist EXP-002S45 confirmation disposition'
          git push
      - name: Evaluate enqueue successor and persist lineage
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S45'); status=it['status']; disp=it.get('checkpoint',{}).get('disposition',status)
          if not any(x.get('id')=='EXP-002S46' for x in q['queue']):
            if status=='COMPLETE_SUPPORTED':
              title='Reference breadth confirmation of joint-class S30 terminal architecture'; rationale='S45 supported explicit topology × mechanism/noise uncertainty with frozen terminal utility propagation; broaden across fresh mixed world families and matched controls before reference-architecture promotion.'
            elif status.startswith('COMPLETE_FALSIFIED'):
              title='Continuous observable harm-risk prediction for terminal S30'; rationale='S45 falsified the hand-specified six-class ontology; replace discrete world classes with a continuous preregistered risk model over observable topology evidence, mechanism predictive scores, credal width, and posterior diagnostics, trained only on fresh training worlds.'
            else:
              title='S45 mechanics recovery with isolated executable lineage'; rationale='S45 encountered an execution/mechanics blocker; recover the same scientific question only after isolating and persisting the exact failed invariant, without exposing held-out worlds.'
            q['queue'].append({'id':'EXP-002S46','title':title,'priority':49.5,'status':'PENDING','depends_on':['EXP-002S45'],'rationale':rationale})
          finding=f"S45 {disp}: explicit joint topology-mechanism/noise latent-class terminal decision evaluated with separated training, validation, and confirmation worlds."
          if finding not in q['established_findings']: q['established_findings'].append(finding)
          q['version']='9.1'; it['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S45_EVALUATION.md'; qp.write_text(json.dumps(q,indent=2))
          lines=['# EXP-002S45 Evaluation','',f'**Disposition:** {disp}','',f"Selected mechanism temperature: {it.get('selected_T')}"]
          for name in ('EXP-002S45_VALIDATION_RESULT.json','EXP-002S45_CONFIRMATION_RESULT.json'):
            p=Path(name)
            if not p.exists(): continue
            z=json.loads(p.read_text()); s=z['summary']; m=s['joint_class']; lines += ['',f"## {name.split('_')[1].title()}",f"Mechanism NLL {s['mechanism_nll']:.6f} vs uniform {s['uniform_nll']:.6f}.",f"Coverage {m['coverage']:.3f}; hybrid edge delta {m['hybrid_mean_edge_delta']:.6f}; CI {m['bootstrap95_hybrid_edge_delta']}; Brier {m['hybrid_mean_brier_delta']:.6f}; harm rate {m['promoted_large_harm_rate']:.3f}; retention {m['improvement_retained']:.3f}."]
          lines += ['','## Next',next(x['rationale'] for x in q['queue'] if x['id']=='EXP-002S46')]; Path('EXP-002S45_EVALUATION.md').write_text('\n'.join(lines))
          PY
          git add EXP-002S45_EVALUATION.md ../swarmite-queue/QUEUE.json
          git commit -m 'Evaluate EXP-002S45 and enqueue successor'
          git push
