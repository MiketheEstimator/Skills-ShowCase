name: Swarmite S44 Joint Shift Transfer
on:
  push:
    paths: ['.github/workflows/swarmite-s44.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Execute frozen S44 stages
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s44_joint_shift as s44
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); item=next(x for x in q['queue'] if x['id']=='EXP-002S44')
          item.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S44_JOINT_TOPOLOGY_HETERO_TRANSFER_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s44_joint_shift.py','runner_commit':'3b2a65777e2419ddf57f343cf1a3770854ca5dde','checkpoint':{'state':'protocol_frozen','next_stage':'mechanics','mechanics_seeds':[73301,73306],'screen_seeds':[73311,73334],'confirmation_seeds':[73401,73448]}}); qp.write_text(json.dumps(q,indent=2))
          out=s44.run(); Path('EXP-002S44_RESULT.json').write_text(json.dumps(out,indent=2)); disposition=out['disposition']
          if disposition=='BLOCKED_MECHANICS': item['status']='BLOCKED_EXECUTION_MECHANICS'
          elif disposition=='FALSIFIED_AT_SCREEN': item['status']='COMPLETE_FALSIFIED_AT_SCREEN'
          elif disposition=='FALSIFIED_ON_CONFIRMATION': item['status']='COMPLETE_FALSIFIED_ON_CONFIRMATION'
          else: item['status']='COMPLETE_TRANSFER_SUPPORTED'
          item['result_artifact']='experiments/swarmite-exp002/EXP-002S44_RESULT.json'; item['result_summary']={k:v for k,v in out.items() if k!='mechanics'}; item['checkpoint']={'state':'complete','disposition':disposition}
          if not any(x.get('id')=='EXP-002S45' for x in q['queue']):
            if disposition=='JOINT_SHIFT_TRANSFER_SUPPORTED':
              title='Reference-architecture breadth confirmation of class-aware S30 terminal inference'; rationale='S44 supported frozen class-aware utility propagation under compound topology plus heteroskedastic mechanism shift; broaden across fresh mixed world families and compare against baseline, always-S30, and scalar-gated controls before promoting the architecture as the reference terminal inference layer.'
            else:
              title='Joint topology-mechanism-noise latent class decision'; rationale='S44 falsified topology-only utility propagation under compound shift; replace the topology-only class posterior with an explicit joint latent class over topology × nonlinear mechanism/noise rather than retuning scalar thresholds or S43 parameters.'
            q['queue'].append({'id':'EXP-002S45','title':title,'priority':49.75,'status':'PENDING','depends_on':['EXP-002S44'],'rationale':rationale})
          finding=f"S44 {disposition}: frozen S43 class-aware decision evaluated prospectively under joint topology plus heteroskedastic nonlinear mechanism shift."
          if finding not in q['established_findings']: q['established_findings'].append(finding)
          q['version']='9.0'; item['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S44_EVALUATION.md'; qp.write_text(json.dumps(q,indent=2))
          lines=['# EXP-002S44 Evaluation','',f'**Disposition:** {disposition}','', 'S44 froze the S43 topology-class decision without retuning and evaluated it under simultaneous graph-density and heteroskedastic nonlinear mechanism shift.']
          for stage in ('screen','confirmation'):
            if stage in out:
              a=out[stage]['class_aware']; c=out[stage]['s39_control']; lines += ['',f'## {stage.title()}',f"Class-aware coverage {a['coverage']:.3f}; hybrid edge delta {a['hybrid_mean_edge_delta']:.6f}; CI {a['bootstrap95_hybrid_edge_delta']}; Brier {a['hybrid_mean_brier_delta']:.6f}; harm rate {a['promoted_large_harm_rate']:.3f}; retention {a['improvement_retained']:.3f}.",f"Frozen S39 control hybrid edge delta {c['hybrid_mean_edge_delta']:.6f}; coverage {c['coverage']:.3f}.",'','### Joint cells']
              for cell,v in a['by_joint_cell'].items(): lines.append(f"- **{cell}**: n={v['n']}, coverage={v['coverage']:.3f}, hybrid edge delta={v['hybrid_mean_edge_delta']:.6f}, harm rate={v['large_harm_rate']:.3f}")
          lines += ['','## Next',next(x['rationale'] for x in q['queue'] if x['id']=='EXP-002S45')]; Path('EXP-002S44_EVALUATION.md').write_text('\n'.join(lines))
          PY
      - name: Persist S44 result and lineage
        run: |
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-exp002/EXP-002S44_* experiments/swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Run EXP-002S44 joint-shift transfer'
          git push
