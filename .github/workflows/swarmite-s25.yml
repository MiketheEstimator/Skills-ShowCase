name: Swarmite S25 Heterogeneous Transfer
on:
  push:
    paths: ['.github/workflows/swarmite-s25.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Execute frozen S25 sequence
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s25_heterogeneous as s25
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); item=next(x for x in q['queue'] if x['id']=='EXP-002S25')
          item.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S25_HETEROGENEOUS_SHIFT_TRANSFER_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s25_heterogeneous.py','checkpoint':{'state':'protocol_frozen','next_stage':'mechanics','mechanics_seeds':list(range(70800,70804))}}); qp.write_text(json.dumps(q,indent=2))
          mr=[s25.paired(s) for s in range(70800,70804)]; ms=s25.summarize(mr); Path('EXP-002S25_MECHANICS_RESULT.json').write_text(json.dumps({'rows':mr,'summary':ms},indent=2)); item['mechanics_artifact']='experiments/swarmite-exp002/EXP-002S25_MECHANICS_RESULT.json'
          mpass=all([ms['trace_identical_all'],ms['dag_count_ok'],ms['spend_ok'],ms['planning_reconstruction_ok'],ms['scores_finite'],ms['posterior_normalized']])
          if not mpass:
              disposition='BLOCKED_MECHANICS'; item['status']='BLOCKED_EXECUTION_MECHANICS'; item['result_summary']=ms; ss=None; cs=None; ci=None
          else:
              item['checkpoint']={'state':'mechanics_passed','next_stage':'screen','screen_seeds':list(range(70804,70820))}; qp.write_text(json.dumps(q,indent=2))
              sr=[s25.paired(s) for s in range(70804,70820)]; ss=s25.summarize(sr); Path('EXP-002S25_SCREEN_RESULT.json').write_text(json.dumps({'rows':sr,'summary':ss},indent=2)); item['screen_artifact']='experiments/swarmite-exp002/EXP-002S25_SCREEN_RESULT.json'
              regimes_ok=all(v['mean_edge_delta']<=.15 and v['mean_brier_delta']<=.015 for v in ss['by_regime'].values())
              spass=bool(ss['mean_edge_delta']<=-.10 and ss['mean_brier_delta']<=.005 and ss['large_harms']<=3 and regimes_ok and ss['trace_identical_all'] and ss['scores_finite'] and ss['posterior_normalized'])
              if not spass:
                  disposition='FALSIFIED_AT_SCREEN'; item['status']='COMPLETE_TRANSFER_NOT_SUPPORTED'; item['result_summary']=ss; cs=None; ci=None
              else:
                  item['checkpoint']={'state':'screen_passed','screen_summary':ss,'next_stage':'confirmation','confirmation_seeds':list(range(70900,70948))}; qp.write_text(json.dumps(q,indent=2))
                  cr=[s25.paired(s) for s in range(70900,70948)]; cs=s25.summarize(cr); ci=s25.bootstrap(cr); Path('EXP-002S25_CONFIRMATION_RESULT.json').write_text(json.dumps({'rows':cr,'summary':cs,'bootstrap95_edge_delta':ci},indent=2)); item['result_artifact']='experiments/swarmite-exp002/EXP-002S25_CONFIRMATION_RESULT.json'
                  regimes_ok=all(v['mean_edge_delta']<=.10 and v['mean_brier_delta']<=.010 for v in cs['by_regime'].values())
                  cpass=bool(cs['mean_edge_delta']<=-.10 and ci[1]<0 and cs['mean_brier_delta']<=.005 and cs['large_harms']<=6 and regimes_ok and cs['trace_identical_all'] and cs['scores_finite'] and cs['posterior_normalized'])
                  disposition='HETEROGENEOUS_TRANSFER_SUPPORTED' if cpass else 'FALSIFIED_ON_CONFIRMATION'; item['status']='COMPLETE_TRANSFER_SUPPORTED' if cpass else 'COMPLETE_TRANSFER_NOT_SUPPORTED'; item['result_summary']={**cs,'bootstrap95_edge_delta':ci}
          item['checkpoint']={'state':'complete','disposition':disposition}
          if not any(x.get('id')=='EXP-002S26' for x in q['queue']):
              if disposition=='HETEROGENEOUS_TRANSFER_SUPPORTED': title='Robust science-posterior scale test'; rationale='S25 supported one frozen robust terminal posterior across heterogeneous regimes; test larger graph size / hypothesis support before further mechanism tuning.'
              else: title='Heterogeneous transfer regime diagnostic'; rationale='S25 failed heterogeneous transfer; isolate the failing regime and mechanism before changing the supported S23/S24 inference.'
              q['queue'].append({'id':'EXP-002S26','title':title,'priority':54.5,'status':'PENDING','depends_on':['EXP-002S25'],'rationale':rationale})
          q['version']='6.0'; finding=f"S25 {disposition}: frozen S23 robust terminal inference evaluated across four heterogeneous mechanism/noise regimes."; q['established_findings'].append(finding) if finding not in q['established_findings'] else None; qp.write_text(json.dumps(q,indent=2))
          lines=['# EXP-002S25 Evaluation','',f'**Disposition:** {disposition}','']
          if ss: lines += ['## Screen',f"- Overall edge delta: {ss['mean_edge_delta']:.6f}",f"- Overall Brier delta: {ss['mean_brier_delta']:.6f}",f"- Large harms: {ss['large_harms']}",f"- By regime: `{ss['by_regime']}`",'']
          if cs: lines += ['## Confirmation',f"- Overall edge delta: {cs['mean_edge_delta']:.6f}",f"- Bootstrap 95% edge CI: {ci}",f"- Overall Brier delta: {cs['mean_brier_delta']:.6f}",f"- Large harms: {cs['large_harms']}",f"- By regime: `{cs['by_regime']}`",'']
          lines += ['## Next',next(x['rationale'] for x in q['queue'] if x['id']=='EXP-002S26')]; Path('EXP-002S25_EVALUATION.md').write_text('\n'.join(lines)); item['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S25_EVALUATION.md'; qp.write_text(json.dumps(q,indent=2))
          PY
      - name: Persist result
        run: |
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-exp002/EXP-002S25_* experiments/swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Complete EXP-002S25 heterogeneous transfer'
          git push
