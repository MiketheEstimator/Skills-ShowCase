name: Swarmite S58 Intervention Conditional Residual Process
on:
  push:
    paths: ['.github/workflows/swarmite-s58.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Start S58
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          qp=Path('experiments/swarmite-queue/QUEUE.json'); q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S58')
          it.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S58_INTERVENTION_CONDITIONAL_RESIDUAL_PROCESS_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s58_intervention_conditional_residual_process.py','checkpoint':{'state':'protocol_frozen','next_stage':'mechanics','mechanics':'2 linear + 2 heteroskedastic','training':'64 + 64','validation':'32 + 32','confirmation':'64 + 64'}})
          q['version']='11.0'; qp.write_text(json.dumps(q,indent=2))
          PY
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Start EXP-002S58 intervention residual process'
          git push
      - name: Mechanics
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s58_intervention_conditional_residual_process as s58
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S58')
          rows=s58.generate(90501,2); ok=s58.mechanics(rows,2)
          Path('EXP-002S58_MECHANICS_RESULT.json').write_text(json.dumps({'passed':ok,'rows':rows},indent=2)); it['mechanics_artifact']='experiments/swarmite-exp002/EXP-002S58_MECHANICS_RESULT.json'
          it['checkpoint']={'state':'mechanics_passed','next_stage':'training'} if ok else {'state':'blocked_mechanics','next_action':'repair S58 mechanics without exposing training'}
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S58_MECHANICS_RESULT.json ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Persist EXP-002S58 mechanics gate'
          git push
      - name: Training
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s58_intervention_conditional_residual_process as s58
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S58')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='mechanics_passed': raise SystemExit(0)
          rows=s58.generate(90601,64); ok=s58.mechanics(rows,64); ev=s58.evaluate(rows,25858) if ok else None
          Path('EXP-002S58_TRAINING_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':ev},indent=2)); it['training_artifact']='experiments/swarmite-exp002/EXP-002S58_TRAINING_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_training_mechanics','next_action':'repair without validation exposure'}
          elif not s58.qualifies(ev): it['status']='COMPLETE_FALSIFIED_AT_TRAINING'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_AT_TRAINING','training':ev}
          else: it['checkpoint']={'state':'training_passed','next_stage':'validation','training':ev}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S58_TRAINING_RESULT.json ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Persist EXP-002S58 training gate'
          git push
      - name: Validation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s58_intervention_conditional_residual_process as s58
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S58')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='training_passed': raise SystemExit(0)
          rows=s58.generate(91001,32); ok=s58.mechanics(rows,32); ev=s58.evaluate(rows,25859) if ok else None
          Path('EXP-002S58_VALIDATION_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':ev},indent=2)); it['validation_artifact']='experiments/swarmite-exp002/EXP-002S58_VALIDATION_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_validation_mechanics','next_action':'repair without confirmation exposure'}
          elif not s58.qualifies(ev,validation=True): it['status']='COMPLETE_FALSIFIED_ON_VALIDATION'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_ON_VALIDATION','validation':ev}
          else: it['checkpoint']={'state':'validation_passed','next_stage':'confirmation','validation':ev}
          qp.write_text(json.dumps(q,indent=2))
          PY
          if [ -f EXP-002S58_VALIDATION_RESULT.json ]; then git add EXP-002S58_VALIDATION_RESULT.json ../swarmite-queue/QUEUE.json; fi
          git diff --cached --quiet || git commit -m 'Persist EXP-002S58 validation gate'
          git push
      - name: Confirmation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s58_intervention_conditional_residual_process as s58
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S58')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='validation_passed': raise SystemExit(0)
          rows=s58.generate(91501,64); ok=s58.mechanics(rows,64); ev=s58.evaluate(rows,25860) if ok else None
          Path('EXP-002S58_CONFIRMATION_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':ev},indent=2)); it['result_artifact']='experiments/swarmite-exp002/EXP-002S58_CONFIRMATION_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_confirmation_mechanics','next_action':'repair confirmation mechanics'}
          elif s58.qualifies(ev,validation=True,confirmation=True): it['status']='COMPLETE_SUPPORTED'; it['checkpoint']={'state':'complete','disposition':'SUPPORTED'}; it['result_summary']=ev
          else: it['status']='COMPLETE_FALSIFIED_ON_CONFIRMATION'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_ON_CONFIRMATION','confirmation':ev}
          qp.write_text(json.dumps(q,indent=2))
          PY
          if [ -f EXP-002S58_CONFIRMATION_RESULT.json ]; then git add EXP-002S58_CONFIRMATION_RESULT.json ../swarmite-queue/QUEUE.json; fi
          git diff --cached --quiet || git commit -m 'Persist EXP-002S58 confirmation'
          git push
      - name: Evaluate and enqueue S59
        if: always()
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S58'); disp=it.get('checkpoint',{}).get('disposition')
          if not disp: qp.write_text(json.dumps(q,indent=2)); raise SystemExit(0)
          tr=json.loads(Path('EXP-002S58_TRAINING_RESULT.json').read_text()) if Path('EXP-002S58_TRAINING_RESULT.json').exists() else {}; ev=tr.get('evaluation') or {}
          if disp=='SUPPORTED': title='S58 breadth transfer without retuning'; rationale='S58 supported intervention-conditional residual-process likelihood. Freeze it and breadth-test without retuning.'
          elif ev.get('mean_abs_family_score_adjustment',0)>=.02: title='Residual-state evidence decomposition diagnostic'; rationale='S58 produced nontrivial intervention-context evidence but did not qualify. Diagnose whether residual-state evidence is correlated with true parent-set ranking errors before introducing another likelihood family.'
          else: title='Local dispersion residual-state likelihood'; rationale='S58 intervention-context evidence collapsed. Replace context identity with observable local residual-dispersion state; do not reuse fitted-magnitude slope.'
          sid='EXP-002S59'
          if not any(x.get('id')==sid for x in q['queue']): q['queue'].append({'id':sid,'title':title,'priority':44.0,'status':'PENDING','depends_on':['EXP-002S58'],'rationale':rationale})
          finding=f'S58 disposition {disp}. Intervention-conditional robust residual-scale evidence was compared prospectively against frozen S46/S30.'
          if ev: finding += f" Training paired edge difference {ev.get('paired_mean_edge_difference')}, heteroskedastic difference {ev.get('by_regime',{}).get('heteroskedastic',{}).get('paired_mean_edge_difference')}, linear difference {ev.get('by_regime',{}).get('linear',{}).get('paired_mean_edge_difference')}, mean absolute score adjustment {ev.get('mean_abs_family_score_adjustment')}."
          if finding not in q['established_findings']: q['established_findings'].append(finding)
          Path('EXP-002S58_EVALUATION.md').write_text('# EXP-002S58 Evaluation\n\n**Disposition:** '+disp+'\n\n'+finding+'\n\n## Next\n'+rationale+'\n'); it['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S58_EVALUATION.md'; q['version']='11.1'; qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S58_EVALUATION.md ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Evaluate EXP-002S58 and enqueue successor'
          git push
