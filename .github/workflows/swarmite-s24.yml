name: Swarmite S24 Robust Transfer
on:
  push:
    paths: ['.github/workflows/swarmite-s24.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Execute frozen S24 sequence
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s24_transfer as s24
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); item=next(x for x in q['queue'] if x['id']=='EXP-002S24')
          item.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S24_ROBUST_LIKELIHOOD_TRANSFER_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s24_transfer.py','checkpoint':{'state':'protocol_frozen','next_stage':'mechanics','mechanics_seeds':list(range(70601,70605))}}); qp.write_text(json.dumps(q,indent=2))
          mr=[s24.paired(s) for s in range(70601,70605)]; ms=s24.summarize(mr); Path('EXP-002S24_MECHANICS_RESULT.json').write_text(json.dumps({'rows':mr,'summary':ms},indent=2)); item['mechanics_artifact']='experiments/swarmite-exp002/EXP-002S24_MECHANICS_RESULT.json'
          mpass=all([ms['trace_identical_all'],ms['dag_count_ok'],ms['spend_ok'],ms['planning_reconstruction_ok'],ms['scores_finite'],ms['posterior_normalized']])
          if not mpass:
              disposition='BLOCKED_MECHANICS'; item['status']='BLOCKED_EXECUTION_MECHANICS'; item['result_summary']=ms; ss=None; cs=None; ci=None
          else:
              item['checkpoint']={'state':'mechanics_passed','next_stage':'screen','screen_seeds':list(range(70611,70623))}; qp.write_text(json.dumps(q,indent=2))
              sr=[s24.paired(s) for s in range(70611,70623)]; ss=s24.summarize(sr); Path('EXP-002S24_SCREEN_RESULT.json').write_text(json.dumps({'rows':sr,'summary':ss},indent=2)); item['screen_artifact']='experiments/swarmite-exp002/EXP-002S24_SCREEN_RESULT.json'
              spass=bool(ss['mean_edge_delta']<=-.10 and ss['mean_brier_delta']<=.005 and ss['large_harms']<=2 and ss['trace_identical_all'] and ss['scores_finite'] and ss['posterior_normalized'])
              if not spass:
                  disposition='FALSIFIED_AT_SCREEN'; item['status']='COMPLETE_TRANSFER_NOT_SUPPORTED'; item['result_summary']=ss; cs=None; ci=None
              else:
                  item['checkpoint']={'state':'screen_passed','screen_summary':ss,'next_stage':'confirmation','confirmation_seeds':list(range(70701,70737))}; qp.write_text(json.dumps(q,indent=2))
                  cr=[s24.paired(s) for s in range(70701,70737)]; cs=s24.summarize(cr); ci=s24.bootstrap(cr); Path('EXP-002S24_CONFIRMATION_RESULT.json').write_text(json.dumps({'rows':cr,'summary':cs,'bootstrap95_edge_delta':ci},indent=2)); item['result_artifact']='experiments/swarmite-exp002/EXP-002S24_CONFIRMATION_RESULT.json'
                  cpass=bool(cs['mean_edge_delta']<=-.10 and ci[1]<0 and cs['mean_brier_delta']<=.005 and cs['large_harms']<=4 and cs['trace_identical_all'] and cs['scores_finite'] and cs['posterior_normalized'])
                  disposition='TRANSFER_SUPPORTED' if cpass else 'FALSIFIED_ON_CONFIRMATION'; item['status']='COMPLETE_TRANSFER_SUPPORTED' if cpass else 'COMPLETE_TRANSFER_NOT_SUPPORTED'; item['result_summary']={**cs,'bootstrap95_edge_delta':ci}
          item['checkpoint']={'state':'complete','disposition':disposition}
          if not any(x.get('id')=='EXP-002S25' for x in q['queue']):
              if disposition=='TRANSFER_SUPPORTED': title='Heterogeneous mechanism/noise transfer'; rationale='S24 transferred without retuning; test the frozen S23 inference across per-world heterogeneous mechanism families and tail thicknesses.'
              else: title='Transfer dimension ablation'; rationale='S24 transfer failed; isolate mechanism-shape shift from tail-thickness shift using matched fresh worlds before changing S23 inference.'
              q['queue'].append({'id':'EXP-002S25','title':title,'priority':54.75,'status':'PENDING','depends_on':['EXP-002S24'],'rationale':rationale})
          q['version']='5.9'; finding=f"S24 {disposition}: frozen S23 robust likelihood tested under softsign + t5 unseen shift without retuning."; q['established_findings'].append(finding) if finding not in q['established_findings'] else None; qp.write_text(json.dumps(q,indent=2))
          lines=['# EXP-002S24 Evaluation','',f'**Disposition:** {disposition}','']
          if ss: lines += ['## Screen',f"- Mean edge delta: {ss['mean_edge_delta']:.6f}",f"- Mean Brier delta: {ss['mean_brier_delta']:.6f}",f"- Mean edge delta vs S5: {ss['mean_edge_delta_vs_s5']:.6f}",f"- Large harms: {ss['large_harms']}",'']
          if cs: lines += ['## Confirmation',f"- Mean edge delta: {cs['mean_edge_delta']:.6f}",f"- Bootstrap 95% edge CI: {ci}",f"- Mean Brier delta: {cs['mean_brier_delta']:.6f}",f"- Mean edge delta vs S5: {cs['mean_edge_delta_vs_s5']:.6f}",f"- Large harms: {cs['large_harms']}",'']
          lines += ['## Next',next(x['rationale'] for x in q['queue'] if x['id']=='EXP-002S25')]; Path('EXP-002S24_EVALUATION.md').write_text('\n'.join(lines)); item['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S24_EVALUATION.md'; qp.write_text(json.dumps(q,indent=2))
          PY
      - name: Persist result
        run: |
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-exp002/EXP-002S24_* experiments/swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Complete EXP-002S24 robust-likelihood transfer'
          git push
