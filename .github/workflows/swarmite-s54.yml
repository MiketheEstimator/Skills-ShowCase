name: Swarmite S54 Nodewise Residual Composition
on:
  push:
    paths: ['.github/workflows/swarmite-s54.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Start S54
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          qp=Path('experiments/swarmite-queue/QUEUE.json'); q=json.loads(qp.read_text())
          s53=next(x for x in q['queue'] if x.get('id')=='EXP-002S53')
          s53['status']='COMPLETE_FALSIFIED_AT_TRAINING'; s53['checkpoint']={'state':'complete','disposition':'FALSIFIED_AT_TRAINING'}
          s54=next(x for x in q['queue'] if x.get('id')=='EXP-002S54')
          s54.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S54_NODEWISE_RESIDUAL_COMPOSITION_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s54_nodewise_residual_composition.py','checkpoint':{'state':'protocol_frozen','next_stage':'mechanics','mechanics':'2 linear + 2 heteroskedastic','training':'64 + 64','validation':'32 + 32','confirmation':'64 + 64'}})
          finding='S53 was falsified at training: continuous graph-level posterior averaging driven by the S52 latent residual-state model did not qualify. Because S52 retained useful latent discrimination, the next justified change is node-local residual-process composition rather than graph-level cap, temperature, or threshold retuning.'
          if finding not in q['established_findings']: q['established_findings'].append(finding)
          q['version']='10.2'; qp.write_text(json.dumps(q,indent=2))
          PY
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Start EXP-002S54 nodewise composition'
          git push
      - name: Mechanics
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s54_nodewise_residual_composition as s54
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S54')
          rows=s54.generate(82501,2); ok=s54.mechanics(rows,2)
          Path('EXP-002S54_MECHANICS_RESULT.json').write_text(json.dumps({'passed':ok,'rows':rows},indent=2)); it['mechanics_artifact']='experiments/swarmite-exp002/EXP-002S54_MECHANICS_RESULT.json'
          if ok: it['checkpoint']={'state':'mechanics_passed','next_stage':'training'}
          else: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_mechanics','next_action':'repair S54 mechanics without exposing training'}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S54_MECHANICS_RESULT.json ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Persist EXP-002S54 mechanics gate'
          git push
      - name: Training
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s54_nodewise_residual_composition as s54
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S54')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='mechanics_passed': raise SystemExit(0)
          rows=s54.generate(82601,64); ok=s54.mechanics(rows,64); model=s54.train_model(rows) if ok else None; ev=s54.evaluate(rows,model,25455) if ok else None
          Path('EXP-002S54_TRAINING_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'model':model,'evaluation':ev},indent=2)); it['training_artifact']='experiments/swarmite-exp002/EXP-002S54_TRAINING_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_training_mechanics','next_action':'repair without validation exposure'}
          elif not s54.qualifies(ev): it['status']='COMPLETE_FALSIFIED_AT_TRAINING'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_AT_TRAINING','training':ev}
          else: it['checkpoint']={'state':'training_passed','next_stage':'validation','model':model,'training':ev}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S54_TRAINING_RESULT.json ../swarmite-queue/QUEUE.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Persist EXP-002S54 training gate'
          git push
      - name: Validation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s54_nodewise_residual_composition as s54
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S54')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='training_passed': raise SystemExit(0)
          model=it['checkpoint']['model']; rows=s54.generate(83001,32); ok=s54.mechanics(rows,32); ev=s54.evaluate(rows,model,25456) if ok else None
          Path('EXP-002S54_VALIDATION_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':ev},indent=2)); it['validation_artifact']='experiments/swarmite-exp002/EXP-002S54_VALIDATION_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_validation_mechanics','next_action':'repair without confirmation exposure'}
          elif not s54.qualifies(ev,validation=True): it['status']='COMPLETE_FALSIFIED_ON_VALIDATION'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_ON_VALIDATION','validation':ev}
          else: it['checkpoint']={'state':'validation_passed','next_stage':'confirmation','model':model,'validation':ev}
          qp.write_text(json.dumps(q,indent=2))
          PY
          if [ -f EXP-002S54_VALIDATION_RESULT.json ]; then git add EXP-002S54_VALIDATION_RESULT.json ../swarmite-queue/QUEUE.json; fi
          git diff --cached --quiet || git commit -m 'Persist EXP-002S54 validation gate'
          git push
      - name: Confirmation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s54_nodewise_residual_composition as s54
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S54')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='validation_passed': raise SystemExit(0)
          model=it['checkpoint']['model']; rows=s54.generate(83501,64); ok=s54.mechanics(rows,64); ev=s54.evaluate(rows,model,25457) if ok else None
          Path('EXP-002S54_CONFIRMATION_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':ev},indent=2)); it['result_artifact']='experiments/swarmite-exp002/EXP-002S54_CONFIRMATION_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_confirmation_mechanics','next_action':'repair confirmation mechanics'}
          elif s54.qualifies(ev,validation=True,confirmation=True): it['status']='COMPLETE_SUPPORTED'; it['checkpoint']={'state':'complete','disposition':'SUPPORTED'}; it['result_summary']=ev
          else: it['status']='COMPLETE_FALSIFIED_ON_CONFIRMATION'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_ON_CONFIRMATION','confirmation':ev}
          qp.write_text(json.dumps(q,indent=2))
          PY
          if [ -f EXP-002S54_CONFIRMATION_RESULT.json ]; then git add EXP-002S54_CONFIRMATION_RESULT.json ../swarmite-queue/QUEUE.json; fi
          git diff --cached --quiet || git commit -m 'Persist EXP-002S54 confirmation'
          git push
      - name: Evaluate and enqueue S55
        if: always()
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S54'); disp=it.get('checkpoint',{}).get('disposition')
          if not disp: qp.write_text(json.dumps(q,indent=2)); raise SystemExit(0)
          tr=json.loads(Path('EXP-002S54_TRAINING_RESULT.json').read_text()) if Path('EXP-002S54_TRAINING_RESULT.json').exists() else {}; ev=tr.get('evaluation') or {}
          if disp=='SUPPORTED': title='S54 breadth transfer without retuning'; rationale='S54 supported nodewise residual-process composition. Freeze the model and test transfer across weak-effect, compound nonlinear/heavy-tail, topology, joint, and heteroskedastic regimes without retuning.'
          elif disp=='FALSIFIED_AT_TRAINING' and ev.get('node_specialist_win_auc') is not None and ev.get('node_specialist_win_auc')>=.60: title='Explicit residual-process class posterior'; rationale='S54 retained nodewise specialist discrimination but local Bernoulli composition did not deliver structural gain. Replace deterministic local mixing with explicit posterior uncertainty over residual-process classes; do not retune S54 weights.'
          else: title='Residual-process likelihood class expansion'; rationale='S54 did not establish sufficient nodewise observable adjudication/transfer. Change the residual-process likelihood representation itself rather than repeat graph-level or node-level mixture tuning.'
          sid='EXP-002S55'
          if not any(x.get('id')==sid for x in q['queue']): q['queue'].append({'id':sid,'title':title,'priority':47.25,'status':'PENDING','depends_on':['EXP-002S54'],'rationale':rationale})
          finding=f'S54 disposition {disp}. Nodewise residual-process posterior composition was evaluated prospectively against the frozen S46/S30 matched control with planning unchanged.'
          if ev: finding += f" Training paired edge difference {ev.get('paired_mean_edge_difference')}, node AUC {ev.get('node_specialist_win_auc')}, node Brier {ev.get('node_specialist_win_brier')}, mean node specialist mass {ev.get('mean_node_specialist_mass')}."
          if finding not in q['established_findings']: q['established_findings'].append(finding)
          Path('EXP-002S54_EVALUATION.md').write_text('# EXP-002S54 Evaluation\n\n**Disposition:** '+disp+'\n\n'+finding+'\n\n## Next\n'+rationale+'\n')
          it['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S54_EVALUATION.md'; q['version']='10.3'; qp.write_text(json.dumps(q,indent=2))
          PY
          if [ -f EXP-002S54_EVALUATION.md ]; then git add EXP-002S54_EVALUATION.md ../swarmite-queue/QUEUE.json; fi
          git diff --cached --quiet || git commit -m 'Evaluate EXP-002S54 and enqueue successor'
          git push
