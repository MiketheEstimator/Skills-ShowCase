name: Swarmite S50 Bounded World Model Mixture
on:
  push:
    paths: ['.github/workflows/swarmite-s50.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Start S50
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('experiments/swarmite-queue/QUEUE.json'); q=json.loads(p.read_text())
          it=next((x for x in q['queue'] if x.get('id')=='EXP-002S50'),None)
          if it is None:
              it={'id':'EXP-002S50','title':'Explicit world-model mixture terminal inference','priority':48.5,'depends_on':['EXP-002S49']}; q['queue'].append(it)
          it.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S50_WORLD_MODEL_MIXTURE_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s50_world_model_mixture.py','runner_commit':'b02425dd854a60e72b1579c2a4079fe86e34116d','checkpoint':{'state':'protocol_frozen','next_stage':'mechanics','mechanics':'2 linear + 2 heteroskedastic','training':'48 + 48','validation':'24 + 24','confirmation':'48 + 48'}})
          q['version']='9.6'; p.write_text(json.dumps(q,indent=2))
          PY
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Start EXP-002S50 bounded world-model mixture'
          git push
      - name: Mechanics
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s50_world_model_mixture as s50
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S50')
          rows=s50.generate(77001,2); ok=s50.mechanics(rows,2); Path('EXP-002S50_MECHANICS_RESULT.json').write_text(json.dumps({'passed':ok,'rows':rows},indent=2)); it['mechanics_artifact']='experiments/swarmite-exp002/EXP-002S50_MECHANICS_RESULT.json'
          if ok: it['checkpoint']={'state':'mechanics_passed','next_stage':'training'}
          else: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_mechanics','next_action':'diagnose mixture mechanics without training exposure'}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S50_MECHANICS_RESULT.json ../swarmite-queue/QUEUE.json
          git commit -m 'Persist EXP-002S50 mechanics gate'
          git push
      - name: Training
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s50_world_model_mixture as s50
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S50')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='mechanics_passed': raise SystemExit(0)
          model,rule=s50.load_anchor(); rows=s50.generate(77101,48); cap,grid=s50.train(rows,model,rule); ok=s50.mechanics(rows,48)
          Path('EXP-002S50_TRAINING_RESULT.json').write_text(json.dumps({'n':len(rows),'mechanics_ok':ok,'selected_cap':cap,'grid':grid,'rows':rows},indent=2)); it['training_artifact']='experiments/swarmite-exp002/EXP-002S50_TRAINING_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_training_mechanics','next_action':'diagnose without validation exposure'}
          elif cap is None: it['status']='COMPLETE_FALSIFIED_AT_TRAINING'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_AT_TRAINING'}
          else: it['selected_cap']=cap; it['checkpoint']={'state':'training_passed','next_stage':'validation','selected_cap':cap}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S50_TRAINING_RESULT.json ../swarmite-queue/QUEUE.json
          git commit -m 'Persist EXP-002S50 training'
          git push
      - name: Validation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s50_world_model_mixture as s50
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S50')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='training_passed': raise SystemExit(0)
          model,rule=s50.load_anchor(); cap=it['selected_cap']; rows=s50.generate(77501,24); ev=s50.evaluate(rows,model,rule,cap,25052); ok=s50.mechanics(rows,24) and s50.qualifies(ev)
          Path('EXP-002S50_VALIDATION_RESULT.json').write_text(json.dumps({'passes':ok,'summary':{k:v for k,v in ev.items() if k!='rows'},'rows':ev['rows']},indent=2)); it['validation_artifact']='experiments/swarmite-exp002/EXP-002S50_VALIDATION_RESULT.json'
          if ok: it['checkpoint']={'state':'validation_passed','next_stage':'heldout_confirmation','selected_cap':cap}
          else: it['status']='COMPLETE_FALSIFIED_ON_VALIDATION'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_ON_VALIDATION'}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S50_VALIDATION_RESULT.json ../swarmite-queue/QUEUE.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Persist EXP-002S50 validation'
          git push
      - name: Confirmation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s50_world_model_mixture as s50
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S50')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='validation_passed': raise SystemExit(0)
          model,rule=s50.load_anchor(); cap=it['selected_cap']; rows=s50.generate(77801,48); ev=s50.evaluate(rows,model,rule,cap,25053); ok=s50.mechanics(rows,48) and s50.qualifies(ev,True)
          Path('EXP-002S50_CONFIRMATION_RESULT.json').write_text(json.dumps({'passes':ok,'summary':{k:v for k,v in ev.items() if k!='rows'},'rows':ev['rows']},indent=2)); it['result_artifact']='experiments/swarmite-exp002/EXP-002S50_CONFIRMATION_RESULT.json'; it['result_summary']={k:v for k,v in ev.items() if k!='rows'}; it['status']='COMPLETE_SUPPORTED' if ok else 'COMPLETE_FALSIFIED_ON_CONFIRMATION'; it['checkpoint']={'state':'complete','disposition':'WORLD_MODEL_MIXTURE_SUPPORTED' if ok else 'FALSIFIED_ON_CONFIRMATION'}; qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S50_CONFIRMATION_RESULT.json ../swarmite-queue/QUEUE.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Persist EXP-002S50 confirmation'
          git push
      - name: Evaluate and enqueue S51
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S50'); status=it['status']; disp=it.get('checkpoint',{}).get('disposition',status)
          if status=='COMPLETE_SUPPORTED':
              title='Full breadth retest of bounded world-model mixture'; rationale='S50 supported explicit bounded world-model uncertainty around S30; freeze the mixture and retest the full breadth panel before reference promotion.'
          elif status.startswith('COMPLETE_FALSIFIED'):
              title='Residual-process representation diagnostic'; rationale='S50 falsified bounded evidence-weighted S30/P_HET averaging. Diagnose whether the heteroskedastic breadth problem is posterior point-estimate failure or adjudication failure before changing representation to a latent residual-process model.'
          else:
              title='S50 mechanics recovery'; rationale='S50 encountered an execution invariant failure; repair exact mechanics before further scientific exposure.'
          if not any(x.get('id')=='EXP-002S51' for x in q['queue']): q['queue'].append({'id':'EXP-002S51','title':title,'priority':48.25,'status':'PENDING','depends_on':['EXP-002S50'],'rationale':rationale})
          finding=f"S50 {disp}: bounded per-world S30/P_HET model uncertainty tested using cross-fitted observable variance evidence while preserving baseline-only planning and frozen S46 adjudication."
          if finding not in q['established_findings']: q['established_findings'].append(finding)
          q['version']='9.6'; it['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S50_EVALUATION.md'; qp.write_text(json.dumps(q,indent=2))
          lines=['# EXP-002S50 Evaluation','',f'**Disposition:** {disp}','', 'S50 tested a bounded hierarchical terminal mixture. Planning remained baseline-only, S30 remained the mandatory anchor, and frozen S46 controlled promotion.']
          for fn,label in [('EXP-002S50_VALIDATION_RESULT.json','Validation'),('EXP-002S50_CONFIRMATION_RESULT.json','Confirmation')]:
              p=Path(fn)
              if p.exists():
                  z=json.loads(p.read_text()); s=z['summary']; m=s['mixture']; f=s['frozen_s46_s30']; lines += ['',f'## {label}',f"Cap {s['cap']}; coverage {m['coverage']:.3f}; edge delta {m['hybrid_mean_edge_delta']:.6f}; CI {m['bootstrap95_hybrid_edge_delta']}; Brier {m['hybrid_mean_brier_delta']:.6f}; harm rate {m['promoted_large_harm_rate']:.3f}; retention {s['improvement_retained_vs_s46']:.3f}.",f"Linear edge {m['by_regime']['linear']['hybrid_mean_edge_delta']:.6f}; heteroskedastic edge {m['by_regime']['heteroskedastic']['hybrid_mean_edge_delta']:.6f}; mean weights linear/hetero {m['by_regime']['linear']['mean_specialist_weight']:.3f}/{m['by_regime']['heteroskedastic']['mean_specialist_weight']:.3f}. Frozen S46/S30 heteroskedastic edge {f['by_regime']['heteroskedastic']['hybrid_mean_edge_delta']:.6f}."]
          lines += ['','## Next',rationale]; Path('EXP-002S50_EVALUATION.md').write_text('\n'.join(lines))
          PY
          git add EXP-002S50_EVALUATION.md ../swarmite-queue/QUEUE.json
          git commit -m 'Evaluate EXP-002S50 and enqueue successor'
          git push
