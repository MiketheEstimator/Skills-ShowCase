name: Swarmite S47 Reference Breadth
on:
  push:
    paths: ['.github/workflows/swarmite-s47.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Persist RUNNING checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          qp=Path('experiments/swarmite-queue/QUEUE.json'); q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S47')
          it.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S47_REFERENCE_BREADTH_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s47_breadth.py','runner_commit':'38050626c183a5277a4e552bead29419779d6dd4','checkpoint':{'state':'protocol_frozen','next_stage':'mechanics','mechanics_seeds':[74301,74306],'screen_seeds':[74311,74358],'confirmation_seeds':[74401,74520],'frozen_anchor':'EXP-002S46_TRAINING_RESULT.json'}}); qp.write_text(json.dumps(q,indent=2))
          PY
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-queue/QUEUE.json
          git commit -m 'Start EXP-002S47 breadth confirmation'
          git push
      - name: Mechanics and screen
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s47_breadth as s47
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S47'); model,rule=s47.load_anchor()
          me=s47.generate(74301,74306); mok=s47.mechanics(me) and s47.counts_ok(me,1); Path('EXP-002S47_MECHANICS_RESULT.json').write_text(json.dumps({'rows':s47.s46.predict(me,model),'passed':mok},indent=2)); it['mechanics_artifact']='experiments/swarmite-exp002/EXP-002S47_MECHANICS_RESULT.json'
          if not mok:
            it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_mechanics','next_action':'diagnose without screen exposure'}
          else:
            sc=s47.generate(74311,74358); ss=s47.summarize(sc,model,rule,24748); ok=s47.counts_ok(sc,8) and s47.screen_pass(ss); Path('EXP-002S47_SCREEN_RESULT.json').write_text(json.dumps({'summary':ss,'passes':ok},indent=2)); it['screen_artifact']='experiments/swarmite-exp002/EXP-002S47_SCREEN_RESULT.json'
            if ok: it['checkpoint']={'state':'screen_passed','next_stage':'heldout_confirmation'}
            else: it['status']='COMPLETE_FALSIFIED_AT_SCREEN'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_AT_SCREEN'}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S47_MECHANICS_RESULT.json EXP-002S47_SCREEN_RESULT.json ../swarmite-queue/QUEUE.json 2>/dev/null || true
          git commit -m 'Persist EXP-002S47 mechanics and screen'
          git push
      - name: Held-out confirmation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s47_breadth as s47
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S47')
          if it['status']!='RUNNING' or it.get('checkpoint',{}).get('state')!='screen_passed': raise SystemExit(0)
          model,rule=s47.load_anchor(); co=s47.generate(74401,74520); cs=s47.summarize(co,model,rule,24749); ok=s47.counts_ok(co,20) and s47.confirmation_pass(cs); Path('EXP-002S47_CONFIRMATION_RESULT.json').write_text(json.dumps({'summary':cs,'passes':ok},indent=2)); it['result_artifact']='experiments/swarmite-exp002/EXP-002S47_CONFIRMATION_RESULT.json'; it['result_summary']={k:v for k,v in cs.items() if k!='rows'}; it['status']='COMPLETE_SUPPORTED' if ok else 'COMPLETE_FALSIFIED_ON_CONFIRMATION'; it['checkpoint']={'state':'complete','disposition':'REFERENCE_BREADTH_SUPPORTED' if ok else 'FALSIFIED_ON_CONFIRMATION'}; qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S47_CONFIRMATION_RESULT.json ../swarmite-queue/QUEUE.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Persist EXP-002S47 confirmation'
          git push
      - name: Evaluate and enqueue successor
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S47'); status=it['status']; disp=it.get('checkpoint',{}).get('disposition',status)
          if not any(x.get('id')=='EXP-002S48' for x in q['queue']):
            if status=='COMPLETE_SUPPORTED':
              title='Open-world reference stress with frozen S46 architecture'; rationale='S47 supported frozen continuous-risk S30 across six distinct world families; test open-world mixtures and parameter extrapolation without refitting before declaring the architecture broadly robust.'
            elif status.startswith('COMPLETE_FALSIFIED'):
              title='Regime-localized robustness repair for S46 architecture'; rationale='S47 identified breadth-transfer failure; isolate the unsupported regime(s) from prospective breadth results and introduce a materially targeted robustness mechanism rather than globally refitting the successful S46 risk model.'
            else:
              title='S47 mechanics recovery'; rationale='S47 encountered an execution/mechanics blocker; repair the exact invariant before further world exposure.'
            q['queue'].append({'id':'EXP-002S48','title':title,'priority':49.0,'status':'PENDING','depends_on':['EXP-002S47'],'rationale':rationale})
          finding=f"S47 {disp}: frozen S46 continuous-risk S30 architecture evaluated across six balanced prospective world families without refitting."
          if finding not in q['established_findings']: q['established_findings'].append(finding)
          if status=='COMPLETE_SUPPORTED':
            ref='Reference terminal architecture now supported: baseline-only planning -> S30 terminal science posterior -> frozen S46 continuous observable risk adjudicator -> baseline fallback, with breadth transfer across six world families.'
            if ref not in q['established_findings']: q['established_findings'].append(ref)
          q['version']='9.3'; it['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S47_EVALUATION.md'; qp.write_text(json.dumps(q,indent=2))
          lines=['# EXP-002S47 Evaluation','',f'**Disposition:** {disp}','', 'The exact S46 risk model and rule were frozen; no S47 fitting or threshold selection occurred.']
          for name,label in [('EXP-002S47_SCREEN_RESULT.json','Screen'),('EXP-002S47_CONFIRMATION_RESULT.json','Confirmation')]:
            p=Path(name)
            if p.exists():
              s=json.loads(p.read_text())['summary']; m=s['continuous_risk']; lines += ['',f'## {label}',f"Coverage {m['coverage']:.3f}; edge delta {m['hybrid_mean_edge_delta']:.6f}; CI {m['bootstrap95_hybrid_edge_delta']}; Brier {m['hybrid_mean_brier_delta']:.6f}; harm rate {m['promoted_large_harm_rate']:.3f}; retention {m['improvement_retained']:.3f}.",'','### By regime']
              for rg,v in m['by_regime'].items(): lines.append(f"- **{rg}**: coverage={v['coverage']:.3f}, edge={v['hybrid_mean_edge_delta']:.6f}, harm={v['large_harm_rate']:.3f}")
          lines += ['','## Next',next(x['rationale'] for x in q['queue'] if x['id']=='EXP-002S48')]; Path('EXP-002S47_EVALUATION.md').write_text('\n'.join(lines))
          PY
          git add EXP-002S47_EVALUATION.md ../swarmite-queue/QUEUE.json
          git commit -m 'Evaluate EXP-002S47 and enqueue successor'
          git push
