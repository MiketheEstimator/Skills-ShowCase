name: Swarmite S46 Continuous Risk
on:
  push:
    paths: ['.github/workflows/swarmite-s46.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Persist RUNNING protocol checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          qp=Path('experiments/swarmite-queue/QUEUE.json'); q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S46')
          it.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S46_CONTINUOUS_RISK_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s46_continuous_risk.py','runner_commit':'a1478f4babededd83810a40a6928b876030b5384','checkpoint':{'state':'protocol_frozen','next_stage':'training','training_seeds':[73801,73920],'validation_seeds':[74001,74060],'confirmation_seeds':[74101,74220]}}); qp.write_text(json.dumps(q,indent=2))
          PY
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-queue/QUEUE.json
          git commit -m 'Start EXP-002S46 continuous risk model'
          git push
      - name: Training and rule freeze
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s46_continuous_risk as s46
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S46')
          tr=s46.generate(73801,73920); model=s46.train_model(tr); pred=s46.predict(tr,model); grid=s46.rule_grid(pred); rule=s46.select_rule(grid); ok=s46.mechanics(tr) and s46.counts_ok(tr,20)
          art={'rows':tr,'model':model,'rule_grid':grid,'selected_rule':rule,'mechanics_ok':s46.mechanics(tr),'counts_ok':s46.counts_ok(tr,20)}; Path('EXP-002S46_TRAINING_RESULT.json').write_text(json.dumps(art,indent=2)); it['training_artifact']='experiments/swarmite-exp002/EXP-002S46_TRAINING_RESULT.json'; it['selected_rule']=rule
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_training_mechanics','next_action':'diagnose without validation exposure'}
          elif rule is None: it['status']='COMPLETE_FALSIFIED_AT_TRAINING'; it['checkpoint']={'state':'complete','disposition':'NO_TRAINING_RULE_QUALIFIED'}
          else: it['checkpoint']={'state':'training_frozen','next_stage':'validation','selected_rule':rule}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S46_TRAINING_RESULT.json ../swarmite-queue/QUEUE.json
          git commit -m 'Persist EXP-002S46 frozen risk model and rule'
          git push
      - name: Validation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s46_continuous_risk as s46
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S46')
          if it['status']!='RUNNING' or it.get('checkpoint',{}).get('state')!='training_frozen': raise SystemExit(0)
          tr=json.loads(Path('EXP-002S46_TRAINING_RESULT.json').read_text()); model=tr['model']; rule=tr['selected_rule']; va=s46.generate(74001,74060); vs=s46.summarize(va,model,rule,24647); ok=s46.counts_ok(va,10) and s46.validation_pass(vs)
          Path('EXP-002S46_VALIDATION_RESULT.json').write_text(json.dumps({'summary':vs,'passes':ok},indent=2)); it['validation_artifact']='experiments/swarmite-exp002/EXP-002S46_VALIDATION_RESULT.json'
          if ok: it['checkpoint']={'state':'validation_passed','next_stage':'heldout_confirmation'}
          else: it['status']='COMPLETE_FALSIFIED_ON_VALIDATION'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_ON_VALIDATION'}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S46_VALIDATION_RESULT.json ../swarmite-queue/QUEUE.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Persist EXP-002S46 validation disposition'
          git push
      - name: Held-out confirmation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s46_continuous_risk as s46
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S46')
          if it['status']!='RUNNING' or it.get('checkpoint',{}).get('state')!='validation_passed': raise SystemExit(0)
          tr=json.loads(Path('EXP-002S46_TRAINING_RESULT.json').read_text()); model=tr['model']; rule=tr['selected_rule']; co=s46.generate(74101,74220); cs=s46.summarize(co,model,rule,24648); ok=s46.counts_ok(co,20) and s46.confirmation_pass(cs)
          Path('EXP-002S46_CONFIRMATION_RESULT.json').write_text(json.dumps({'summary':cs,'passes':ok},indent=2)); it['result_artifact']='experiments/swarmite-exp002/EXP-002S46_CONFIRMATION_RESULT.json'; it['result_summary']={k:v for k,v in cs.items() if k!='rows'}; it['status']='COMPLETE_SUPPORTED' if ok else 'COMPLETE_FALSIFIED_ON_CONFIRMATION'; it['checkpoint']={'state':'complete','disposition':'CONTINUOUS_RISK_SUPPORTED' if ok else 'FALSIFIED_ON_CONFIRMATION'}; qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S46_CONFIRMATION_RESULT.json ../swarmite-queue/QUEUE.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Persist EXP-002S46 confirmation disposition'
          git push
      - name: Evaluate enqueue successor and persist lineage
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S46'); status=it['status']; disp=it.get('checkpoint',{}).get('disposition',status)
          if not any(x.get('id')=='EXP-002S47' for x in q['queue']):
            if status=='COMPLETE_SUPPORTED':
              title='Reference breadth confirmation of continuous-risk S30 architecture'; rationale='S46 supported continuous observable risk adjudication around S30; broaden to mixed linear, nonlinear, heavy-tail, heteroskedastic, effect-size, and topology shifts with frozen coefficients and rule before reference promotion.'
            elif status.startswith('COMPLETE_FALSIFIED'):
              title='Nonlinear observable risk learner for S30 adjudication'; rationale='S46 falsified the fixed low-capacity linear risk model; test a materially different nonlinear risk mechanism using preregistered shallow basis expansion/ensemble while preserving strict train-validation-confirmation separation and the S30 planning/inference split.'
            else:
              title='S46 executable mechanics recovery'; rationale='S46 encountered an execution/mechanics blocker; isolate and repair the exact invariant before any held-out exposure.'
            q['queue'].append({'id':'EXP-002S47','title':title,'priority':49.25,'status':'PENDING','depends_on':['EXP-002S46'],'rationale':rationale})
          finding=f"S46 {disp}: continuous observable per-world risk prediction for S30 evaluated prospectively after discrete joint-class S45 failed from over-abstention."
          if finding not in q['established_findings']: q['established_findings'].append(finding)
          q['version']='9.2'; it['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S46_EVALUATION.md'; qp.write_text(json.dumps(q,indent=2))
          lines=['# EXP-002S46 Evaluation','',f'**Disposition:** {disp}','',f"Selected rule: {it.get('selected_rule')}"]
          for name,label in [('EXP-002S46_VALIDATION_RESULT.json','Validation'),('EXP-002S46_CONFIRMATION_RESULT.json','Confirmation')]:
            p=Path(name)
            if p.exists():
              s=json.loads(p.read_text())['summary']; m=s['continuous_risk']; lines += ['',f'## {label}',f"Coverage {m['coverage']:.3f}; edge delta {m['hybrid_mean_edge_delta']:.6f}; CI {m['bootstrap95_hybrid_edge_delta']}; Brier {m['hybrid_mean_brier_delta']:.6f}; harm rate {m['promoted_large_harm_rate']:.3f}; retention {m['improvement_retained']:.3f}.",f"Risk Brier {s['risk_brier']:.6f} vs constant-prevalence {s['constant_prevalence_brier']:.6f}."]
          lines += ['','## Next',next(x['rationale'] for x in q['queue'] if x['id']=='EXP-002S47')]; Path('EXP-002S46_EVALUATION.md').write_text('\n'.join(lines))
          PY
          git add EXP-002S46_EVALUATION.md ../swarmite-queue/QUEUE.json
          git commit -m 'Evaluate EXP-002S46 and enqueue successor'
          git push
