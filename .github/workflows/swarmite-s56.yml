name: Swarmite S56 Continuous Variance Process
on:
  push:
    paths: ['.github/workflows/swarmite-s56.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Start S56
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          qp=Path('experiments/swarmite-queue/QUEUE.json'); q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S56')
          it.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S56_CONTINUOUS_VARIANCE_PROCESS_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s56_continuous_variance_process.py','checkpoint':{'state':'protocol_frozen','next_stage':'mechanics','mechanics':'2 linear + 2 heteroskedastic','training':'64 + 64','validation':'32 + 32','confirmation':'64 + 64'}})
          q['version']='10.6'; qp.write_text(json.dumps(q,indent=2))
          PY
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Start EXP-002S56 continuous variance process'
          git push
      - name: Mechanics
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s56_continuous_variance_process as s56
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S56')
          rows=s56.generate(86501,2); ok=s56.mechanics(rows,2)
          Path('EXP-002S56_MECHANICS_RESULT.json').write_text(json.dumps({'passed':ok,'rows':rows},indent=2)); it['mechanics_artifact']='experiments/swarmite-exp002/EXP-002S56_MECHANICS_RESULT.json'
          it['checkpoint']={'state':'mechanics_passed','next_stage':'training'} if ok else {'state':'blocked_mechanics','next_action':'repair S56 mechanics without exposing training'}
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S56_MECHANICS_RESULT.json ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Persist EXP-002S56 mechanics gate'
          git push
      - name: Training
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s56_continuous_variance_process as s56
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S56')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='mechanics_passed': raise SystemExit(0)
          rows=s56.generate(86601,64); ok=s56.mechanics(rows,64); ev=s56.evaluate(rows,25656) if ok else None
          Path('EXP-002S56_TRAINING_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':ev},indent=2)); it['training_artifact']='experiments/swarmite-exp002/EXP-002S56_TRAINING_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_training_mechanics','next_action':'repair without validation exposure'}
          elif not s56.qualifies(ev): it['status']='COMPLETE_FALSIFIED_AT_TRAINING'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_AT_TRAINING','training':ev}
          else: it['checkpoint']={'state':'training_passed','next_stage':'validation','training':ev}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S56_TRAINING_RESULT.json ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Persist EXP-002S56 training gate'
          git push
      - name: Validation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s56_continuous_variance_process as s56
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S56')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='training_passed': raise SystemExit(0)
          rows=s56.generate(87001,32); ok=s56.mechanics(rows,32); ev=s56.evaluate(rows,25657) if ok else None
          Path('EXP-002S56_VALIDATION_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':ev},indent=2)); it['validation_artifact']='experiments/swarmite-exp002/EXP-002S56_VALIDATION_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_validation_mechanics','next_action':'repair without confirmation exposure'}
          elif not s56.qualifies(ev,validation=True): it['status']='COMPLETE_FALSIFIED_ON_VALIDATION'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_ON_VALIDATION','validation':ev}
          else: it['checkpoint']={'state':'validation_passed','next_stage':'confirmation','validation':ev}
          qp.write_text(json.dumps(q,indent=2))
          PY
          if [ -f EXP-002S56_VALIDATION_RESULT.json ]; then git add EXP-002S56_VALIDATION_RESULT.json ../swarmite-queue/QUEUE.json; fi
          git diff --cached --quiet || git commit -m 'Persist EXP-002S56 validation gate'
          git push
      - name: Confirmation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s56_continuous_variance_process as s56
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S56')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='validation_passed': raise SystemExit(0)
          rows=s56.generate(87501,64); ok=s56.mechanics(rows,64); ev=s56.evaluate(rows,25658) if ok else None
          Path('EXP-002S56_CONFIRMATION_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':ev},indent=2)); it['result_artifact']='experiments/swarmite-exp002/EXP-002S56_CONFIRMATION_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_confirmation_mechanics','next_action':'repair confirmation mechanics'}
          elif s56.qualifies(ev,validation=True,confirmation=True): it['status']='COMPLETE_SUPPORTED'; it['checkpoint']={'state':'complete','disposition':'SUPPORTED'}; it['result_summary']=ev
          else: it['status']='COMPLETE_FALSIFIED_ON_CONFIRMATION'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_ON_CONFIRMATION','confirmation':ev}
          qp.write_text(json.dumps(q,indent=2))
          PY
          if [ -f EXP-002S56_CONFIRMATION_RESULT.json ]; then git add EXP-002S56_CONFIRMATION_RESULT.json ../swarmite-queue/QUEUE.json; fi
          git diff --cached --quiet || git commit -m 'Persist EXP-002S56 confirmation'
          git push
      - name: Evaluate and enqueue S57
        if: always()
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S56'); disp=it.get('checkpoint',{}).get('disposition')
          if not disp: qp.write_text(json.dumps(q,indent=2)); raise SystemExit(0)
          tr=json.loads(Path('EXP-002S56_TRAINING_RESULT.json').read_text()) if Path('EXP-002S56_TRAINING_RESULT.json').exists() else {}; ev=tr.get('evaluation') or {}
          if disp=='SUPPORTED': title='S56 breadth transfer without retuning'; rationale='S56 supported continuous variance-process marginal likelihood. Freeze it and test breadth across weak-effect, nonlinear/heavy-tail, topology, joint, and heteroskedastic regimes without retuning.'
          elif ev.get('mean_abs_family_score_adjustment',0)>=.02: title='Robust continuous residual-process likelihood'; rationale='S56 produced nontrivial continuous variance-process evidence but did not qualify structurally. Replace Gaussian residual likelihood with a robust heavy-tailed residual process while preserving continuous variance marginalization; do not retune the gamma grid.'
          else: title='Expanded continuous variance covariates'; rationale='S56 variance-process score adjustments collapsed toward zero. Expand observable variance-process covariates beyond fitted-magnitude slope before another structural combination mechanism.'
          sid='EXP-002S57'
          if not any(x.get('id')==sid for x in q['queue']): q['queue'].append({'id':sid,'title':title,'priority':46.0,'status':'PENDING','depends_on':['EXP-002S56'],'rationale':rationale})
          finding=f'S56 disposition {disp}. Continuous variance-process evidence was marginalized within node/parent likelihoods and compared prospectively against frozen S46/S30 with planning unchanged.'
          if ev: finding += f" Training paired edge difference {ev.get('paired_mean_edge_difference')}, heteroskedastic difference {ev.get('by_regime',{}).get('heteroskedastic',{}).get('paired_mean_edge_difference')}, linear difference {ev.get('by_regime',{}).get('linear',{}).get('paired_mean_edge_difference')}, mean absolute score adjustment {ev.get('mean_abs_family_score_adjustment')}."
          if finding not in q['established_findings']: q['established_findings'].append(finding)
          Path('EXP-002S56_EVALUATION.md').write_text('# EXP-002S56 Evaluation\n\n**Disposition:** '+disp+'\n\n'+finding+'\n\n## Next\n'+rationale+'\n'); it['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S56_EVALUATION.md'; q['version']='10.7'; qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S56_EVALUATION.md ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Evaluate EXP-002S56 and enqueue successor'
          git push
