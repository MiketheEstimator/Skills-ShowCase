name: Swarmite S63 Posterior-Mass Parent-Family Repair
on:
  push:
    paths: ['.github/workflows/swarmite-s63.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Start S63
        run: |
          git pull --rebase
          python - <<'PY'
          import json
          from pathlib import Path
          qp=Path('experiments/swarmite-queue/QUEUE.json'); q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S63')
          if it.get('status')=='PENDING':
              it.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S63_POSTERIOR_MASS_PARENT_REPAIR_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s63_posterior_mass_parent_repair.py','checkpoint':{'state':'protocol_frozen','next_stage':'mechanics','mechanics':'2 linear + 2 heteroskedastic','training':'64 + 64','validation':'32 + 32','confirmation':'64 + 64'}})
              q['version']='12.0'
          qp.write_text(json.dumps(q,indent=2))
          PY
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Start EXP-002S63 posterior-mass parent repair'
          git push
      - name: Mechanics
        working-directory: experiments/swarmite-exp002
        run: |
          git pull --rebase
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s63_posterior_mass_parent_repair as s63
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S63')
          if it.get('status')!='RUNNING': raise SystemExit(0)
          rows=s63.generate(95601,2); ok=s63.mechanics(rows,2); Path('EXP-002S63_MECHANICS_RESULT.json').write_text(json.dumps({'passed':ok,'rows':rows},indent=2)); it['mechanics_artifact']='experiments/swarmite-exp002/EXP-002S63_MECHANICS_RESULT.json'
          if ok: it['checkpoint']={'state':'mechanics_passed','next_stage':'training'}
          else: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_mechanics','next_action':'repair S63 without opening training'}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S63_MECHANICS_RESULT.json ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Persist EXP-002S63 mechanics gate'
          git push
      - name: Training
        working-directory: experiments/swarmite-exp002
        run: |
          git pull --rebase
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s63_posterior_mass_parent_repair as s63
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S63')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='mechanics_passed': raise SystemExit(0)
          rows=s63.generate(95701,64); ok=s63.mechanics(rows,64)
          if not ok:
              Path('EXP-002S63_TRAINING_RESULT.json').write_text(json.dumps({'mechanics_ok':False},indent=2)); it['status']='BLOCKED_EXECUTION_TRAINING_MECHANICS'; it['checkpoint']={'state':'blocked_training_mechanics','next_action':'repair without validation'}
          else:
              model=s63.train_model(rows); ev=s63.evaluate(rows,model,26363); passed=s63.qualifies(ev); Path('EXP-002S63_TRAINING_RESULT.json').write_text(json.dumps({'mechanics_ok':True,'model':model,'evaluation':ev,'qualified':passed},indent=2)); Path('EXP-002S63_MODEL.json').write_text(json.dumps(model,indent=2)); it['model_artifact']='experiments/swarmite-exp002/EXP-002S63_MODEL.json'
              if passed: it['checkpoint']={'state':'training_passed','next_stage':'validation','training':ev}
              else:
                  disp=s63.failure_class(ev)+'_AT_TRAINING'; it['status']='COMPLETE_'+disp; it['checkpoint']={'state':'complete','disposition':disp,'training':ev}; it['result_summary']=ev
          it['training_artifact']='experiments/swarmite-exp002/EXP-002S63_TRAINING_RESULT.json'; qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S63_TRAINING_RESULT.json ../swarmite-queue/QUEUE.json
          test ! -f EXP-002S63_MODEL.json || git add EXP-002S63_MODEL.json
          git diff --cached --quiet || git commit -m 'Persist EXP-002S63 training gate'
          git push
      - name: Validation
        working-directory: experiments/swarmite-exp002
        run: |
          git pull --rebase
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s63_posterior_mass_parent_repair as s63
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S63')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='training_passed': raise SystemExit(0)
          model=json.loads(Path('EXP-002S63_MODEL.json').read_text()); rows=s63.generate(96101,32); ok=s63.mechanics(rows,32); ev=s63.evaluate(rows,model,26364) if ok else None; passed=bool(ok and s63.qualifies(ev,validation=True)); Path('EXP-002S63_VALIDATION_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':ev,'qualified':passed},indent=2)); it['validation_artifact']='experiments/swarmite-exp002/EXP-002S63_VALIDATION_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_VALIDATION_MECHANICS'; it['checkpoint']={'state':'blocked_validation_mechanics','next_action':'repair without confirmation'}
          elif passed: it['checkpoint']={'state':'validation_passed','next_stage':'confirmation','validation':ev}
          else:
              disp=s63.failure_class(ev)+'_ON_VALIDATION'; it['status']='COMPLETE_'+disp; it['checkpoint']={'state':'complete','disposition':disp,'validation':ev}; it['result_summary']=ev
          qp.write_text(json.dumps(q,indent=2))
          PY
          test ! -f EXP-002S63_VALIDATION_RESULT.json || git add EXP-002S63_VALIDATION_RESULT.json
          git add ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Persist EXP-002S63 validation gate'
          git push
      - name: Confirmation
        working-directory: experiments/swarmite-exp002
        run: |
          git pull --rebase
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s63_posterior_mass_parent_repair as s63
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S63')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='validation_passed': raise SystemExit(0)
          model=json.loads(Path('EXP-002S63_MODEL.json').read_text()); rows=s63.generate(96401,64); ok=s63.mechanics(rows,64); ev=s63.evaluate(rows,model,26365) if ok else None; passed=bool(ok and s63.qualifies(ev,validation=True,confirmation=True)); Path('EXP-002S63_CONFIRMATION_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'evaluation':ev,'qualified':passed},indent=2)); it['confirmation_artifact']='experiments/swarmite-exp002/EXP-002S63_CONFIRMATION_RESULT.json'
          if not ok: it['status']='BLOCKED_EXECUTION_CONFIRMATION_MECHANICS'; it['checkpoint']={'state':'blocked_confirmation_mechanics','next_action':'repair confirmation mechanics'}
          elif passed: it['status']='COMPLETE_SUPPORTED'; it['checkpoint']={'state':'complete','disposition':'SUPPORTED','confirmation':ev}; it['result_summary']=ev
          else:
              disp=s63.failure_class(ev)+'_ON_CONFIRMATION'; it['status']='COMPLETE_'+disp; it['checkpoint']={'state':'complete','disposition':disp,'confirmation':ev}; it['result_summary']=ev
          qp.write_text(json.dumps(q,indent=2))
          PY
          test ! -f EXP-002S63_CONFIRMATION_RESULT.json || git add EXP-002S63_CONFIRMATION_RESULT.json
          git add ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Persist EXP-002S63 confirmation gate'
          git push
      - name: Evaluate and enqueue S64
        if: always()
        working-directory: experiments/swarmite-exp002
        run: |
          git pull --rebase
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S63'); cp=it.get('checkpoint',{}); disp=cp.get('disposition')
          if not disp: qp.write_text(json.dumps(q,indent=2)); raise SystemExit(0)
          ev=it.get('result_summary') or cp.get('confirmation') or cp.get('validation') or cp.get('training') or {}; sid='EXP-002S64'
          if disp=='SUPPORTED':
              title='Frozen S63 breadth and mechanism-shift transfer'; rationale='S63 passed prospective train/validation/confirmation. Test fixed S63 model and repair geometry across breadth/mechanism shifts without retuning.'
          elif 'TARGETING' in disp:
              title='Set-valued posterior-disagreement parent uncertainty'; rationale='S63 prospectively lost localization or single-proposal usefulness. Replace the single nominated family with a set-valued posterior mass representation; do not tune S63 thresholds or tilt.'
          else:
              title='Constrained local posterior projection repair'; rationale='S63 retained supported localization/proposal but falsified exponential tilt geometry. Preserve S62 evidence and replace tilt with a constrained local posterior projection/replacement; do not tune lambda.'
          if not any(x.get('id')==sid for x in q['queue']): q['queue'].append({'id':sid,'title':title,'priority':42.2,'status':'PENDING','depends_on':['EXP-002S63'],'rationale':rationale})
          finding=(f"S63 disposition {disp}. paired edge difference {ev.get('paired_mean_edge_difference')}; AUC {ev.get('error_localization_auc')}; competitor usefulness {ev.get('competitor_useful_fraction_on_error_nodes')}; promoted harms candidate/control {ev.get('candidate_promoted_large_harms')}/{ev.get('control_promoted_large_harms')}.")
          if finding not in q['established_findings']: q['established_findings'].append(finding)
          Path('EXP-002S63_EVALUATION.md').write_text('# EXP-002S63 Evaluation\n\n**Disposition:** '+str(disp)+'\n\n'+finding+'\n\n## Next\n'+rationale+'\n'); it['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S63_EVALUATION.md'; q['version']='12.1'; qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S63_EVALUATION.md ../swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Evaluate EXP-002S63 and enqueue successor'
          git push
