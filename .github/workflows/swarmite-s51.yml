name: Swarmite S51 Residual Process Diagnostic
on:
  push:
    paths: ['.github/workflows/swarmite-s51.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Start S51
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('experiments/swarmite-queue/QUEUE.json'); q=json.loads(p.read_text())
          it=next(x for x in q['queue'] if x.get('id')=='EXP-002S51')
          it.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S51_RESIDUAL_PROCESS_DIAGNOSTIC_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s51_residual_diagnostic.py','runner_commit':'ef8e88e2bff52e3bfab3e7779bd1e1e0d56d7739','checkpoint':{'state':'protocol_frozen','next_stage':'mechanics','mechanics':'2 linear + 2 heteroskedastic','diagnostic':'48 linear + 48 heteroskedastic'}})
          q['version']='9.7'; p.write_text(json.dumps(q,indent=2))
          PY
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-queue/QUEUE.json
          git diff --cached --quiet || git commit -m 'Start EXP-002S51 residual-process diagnostic'
          git push
      - name: Mechanics
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s51_residual_diagnostic as s51
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S51')
          rows=s51.generate(78101,2); ok=s51.mechanics(rows,2)
          Path('EXP-002S51_MECHANICS_RESULT.json').write_text(json.dumps({'passed':ok,'rows':rows},indent=2)); it['mechanics_artifact']='experiments/swarmite-exp002/EXP-002S51_MECHANICS_RESULT.json'
          if ok: it['checkpoint']={'state':'mechanics_passed','next_stage':'diagnostic_panel'}
          else: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_mechanics','next_action':'repair S51 mechanics without diagnostic exposure'}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S51_MECHANICS_RESULT.json ../swarmite-queue/QUEUE.json
          git commit -m 'Persist EXP-002S51 mechanics gate'
          git push
      - name: Diagnostic panel
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s51_residual_diagnostic as s51
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S51')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='mechanics_passed': raise SystemExit(0)
          rows=s51.generate(78201,48); ok=s51.mechanics(rows,48); dg=s51.diagnose(rows) if ok else None
          Path('EXP-002S51_DIAGNOSTIC_RESULT.json').write_text(json.dumps({'mechanics_ok':ok,'diagnostic':dg,'rows':rows},indent=2)); it['result_artifact']='experiments/swarmite-exp002/EXP-002S51_DIAGNOSTIC_RESULT.json'
          if not ok:
              it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_panel_mechanics','next_action':'diagnose mechanics'}
          else:
              cls=dg['classification']; it['status']='COMPLETE_DIAGNOSTIC_'+cls; it['result_summary']=dg; it['checkpoint']={'state':'complete','disposition':cls}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S51_DIAGNOSTIC_RESULT.json ../swarmite-queue/QUEUE.json
          git commit -m 'Persist EXP-002S51 diagnostic panel'
          git push
      - name: Evaluate and enqueue S52
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S51')
          cls=it.get('checkpoint',{}).get('disposition')
          if cls in ('ADJUDICATION_DOMINANT','POINT_ESTIMATE_DOMINANT','MIXED'):
              if cls=='ADJUDICATION_DOMINANT':
                  title='Latent residual-state adjudication model'; rationale='S51 found specialist headroom but weak observable discrimination. Replace scalar variance evidence with a richer latent residual-state representation while retaining S30 as anchor.'
              elif cls=='POINT_ESTIMATE_DOMINANT':
                  title='Latent residual-process terminal likelihood'; rationale='S51 found little oracle specialist headroom. Change the terminal heteroskedastic representation itself rather than the gate.'
              else:
                  title='Joint latent residual-process specialist and adjudicator'; rationale='S51 found mixed posterior and adjudication limitations. Use one latent residual-process state to supply both specialist likelihood and observable adjudication evidence, retaining S30 as mandatory anchor.'
              if not any(x.get('id')=='EXP-002S52' for x in q['queue']): q['queue'].append({'id':'EXP-002S52','title':title,'priority':48.0,'status':'PENDING','depends_on':['EXP-002S51'],'rationale':rationale})
              dg=it['result_summary']; h=dg['by_regime']['heteroskedastic']; finding=f"S51 {cls}: heteroskedastic oracle two-posterior headroom {h['mean_oracle_two_posterior_headroom']:.3f} with 95% bootstrap {h['oracle_headroom_bootstrap95']}; q_het specialist-win AUC {h['qhet_auc_for_specialist_win']}."
              if finding not in q['established_findings']: q['established_findings'].append(finding)
              Path('EXP-002S51_EVALUATION.md').write_text('# EXP-002S51 Evaluation\n\n**Disposition:** '+cls+'\n\n'+finding+'\n\n## Next\n'+rationale)
              it['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S51_EVALUATION.md'
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S51_EVALUATION.md ../swarmite-queue/QUEUE.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Evaluate EXP-002S51 and enqueue successor'
          git push
