name: Swarmite S48 Heteroskedastic Repair
on:
  push:
    paths: ['.github/workflows/swarmite-s48.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - name: Start S48
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('experiments/swarmite-queue/QUEUE.json'); q=json.loads(p.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S48')
          it.update({'status':'RUNNING','protocol':'experiments/swarmite-exp002/EXP-002S48_HETEROSKEDASTIC_REPAIR_PROTOCOL.md','runner':'experiments/swarmite-exp002/swarmite_exp002_s48_hetero_repair.py','runner_commit':'9b5e5fb50e5582eacd150daf2c4f83e054dc7ac8','checkpoint':{'state':'protocol_frozen','next_stage':'training','training':'48 linear + 48 heteroskedastic fresh worlds','validation':'24 + 24 fresh worlds','confirmation':'48 + 48 held-out worlds'}}); p.write_text(json.dumps(q,indent=2))
          PY
          git config user.name swarmite-worker
          git config user.email swarmite-worker@users.noreply.github.com
          git add experiments/swarmite-queue/QUEUE.json
          git commit -m 'Start EXP-002S48 targeted heteroskedastic repair'
          git push
      - name: Training
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s48_hetero_repair as s48
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S48'); model,rule=s48.load_anchor()
          tr=s48.generate(74601,48); rep,grid=s48.train(tr,model,rule); mok=s48.mechanics(tr,48)
          art={'n':len(tr),'mechanics_ok':mok,'selected_repair':rep,'grid':grid,'rows':tr}; Path('EXP-002S48_TRAINING_RESULT.json').write_text(json.dumps(art,indent=2)); it['training_artifact']='experiments/swarmite-exp002/EXP-002S48_TRAINING_RESULT.json'
          if not mok: it['status']='BLOCKED_EXECUTION_MECHANICS'; it['checkpoint']={'state':'blocked_mechanics','next_action':'diagnose training mechanics without validation exposure'}
          elif rep is None: it['status']='COMPLETE_FALSIFIED_AT_TRAINING'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_AT_TRAINING'}
          else: it['selected_repair']=rep; it['checkpoint']={'state':'training_passed','next_stage':'validation','selected_repair':rep}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S48_TRAINING_RESULT.json ../swarmite-queue/QUEUE.json
          git commit -m 'Persist EXP-002S48 training'
          git push
      - name: Validation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s48_hetero_repair as s48
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S48')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='training_passed': raise SystemExit(0)
          model,rule=s48.load_anchor(); rep=it['selected_repair']; va=s48.generate(75001,24); ev=s48.evaluate(va,model,rule,rep,24851); ok=s48.mechanics(va,24) and s48.qualifies(ev); Path('EXP-002S48_VALIDATION_RESULT.json').write_text(json.dumps({'passes':ok,'summary':{k:v for k,v in ev.items() if k!='rows'},'rows':ev['rows']},indent=2)); it['validation_artifact']='experiments/swarmite-exp002/EXP-002S48_VALIDATION_RESULT.json'
          if not ok: it['status']='COMPLETE_FALSIFIED_ON_VALIDATION'; it['checkpoint']={'state':'complete','disposition':'FALSIFIED_ON_VALIDATION'}
          else: it['checkpoint']={'state':'validation_passed','next_stage':'heldout_confirmation','selected_repair':rep}
          qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S48_VALIDATION_RESULT.json ../swarmite-queue/QUEUE.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Persist EXP-002S48 validation'
          git push
      - name: Confirmation
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import swarmite_exp002_s48_hetero_repair as s48
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S48')
          if it.get('status')!='RUNNING' or it.get('checkpoint',{}).get('state')!='validation_passed': raise SystemExit(0)
          model,rule=s48.load_anchor(); rep=it['selected_repair']; co=s48.generate(75401,48); ev=s48.evaluate(co,model,rule,rep,24852); ok=s48.mechanics(co,48) and s48.qualifies(ev,True); Path('EXP-002S48_CONFIRMATION_RESULT.json').write_text(json.dumps({'passes':ok,'summary':{k:v for k,v in ev.items() if k!='rows'},'rows':ev['rows']},indent=2)); it['result_artifact']='experiments/swarmite-exp002/EXP-002S48_CONFIRMATION_RESULT.json'; it['result_summary']={k:v for k,v in ev.items() if k!='rows'}; it['status']='COMPLETE_SUPPORTED' if ok else 'COMPLETE_FALSIFIED_ON_CONFIRMATION'; it['checkpoint']={'state':'complete','disposition':'TARGETED_HETEROSKEDASTIC_REPAIR_SUPPORTED' if ok else 'FALSIFIED_ON_CONFIRMATION'}; qp.write_text(json.dumps(q,indent=2))
          PY
          git add EXP-002S48_CONFIRMATION_RESULT.json ../swarmite-queue/QUEUE.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Persist EXP-002S48 confirmation'
          git push
      - name: Evaluate and enqueue S49
        working-directory: experiments/swarmite-exp002
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('../..'); qp=root/'experiments/swarmite-queue/QUEUE.json'; q=json.loads(qp.read_text()); it=next(x for x in q['queue'] if x['id']=='EXP-002S48'); status=it['status']; disp=it.get('checkpoint',{}).get('disposition',status)
          if status=='COMPLETE_SUPPORTED':
            title='Repaired reference breadth retest'; rationale='S48 supported a localized heteroskedasticity repair; freeze S46 plus the S48 add-on and retest the full six-regime S47 breadth panel on fresh worlds before reference promotion.'
          elif status.startswith('COMPLETE_FALSIFIED'):
            title='Explicit heteroskedastic terminal likelihood specialist'; rationale='The localized observable variance gate did not prospectively repair breadth transfer; add a materially different heteroskedastic terminal likelihood specialist while preserving baseline-only planning and S30 as anchor.'
          else:
            title='S48 mechanics recovery'; rationale='S48 encountered an execution invariant failure; repair exact mechanics before further scientific exposure.'
          if not any(x.get('id')=='EXP-002S49' for x in q['queue']): q['queue'].append({'id':'EXP-002S49','title':title,'priority':48.75,'status':'PENDING','depends_on':['EXP-002S48'],'rationale':rationale})
          finding=f"S48 {disp}: targeted residual-heteroskedasticity repair tested around the frozen S46/S30 architecture on separated linear-anchor and heteroskedastic worlds."
          if finding not in q['established_findings']: q['established_findings'].append(finding)
          q['version']='9.4'; it['evaluation_artifact']='experiments/swarmite-exp002/EXP-002S48_EVALUATION.md'; qp.write_text(json.dumps(q,indent=2))
          lines=['# EXP-002S48 Evaluation','',f'**Disposition:** {disp}','', 'S48 altered only the uncertainty/adjudication layer around frozen S46/S30; planning and terminal point inference remained unchanged.']
          for fn,label in [('EXP-002S48_VALIDATION_RESULT.json','Validation'),('EXP-002S48_CONFIRMATION_RESULT.json','Confirmation')]:
            p=Path(fn)
            if p.exists():
              z=json.loads(p.read_text()); s=z['summary']; m=s['repair']; b=s['frozen_s46']; lines += ['',f'## {label}',f"Repair coverage {m['coverage']:.3f}; edge delta {m['hybrid_mean_edge_delta']:.6f}; CI {m['bootstrap95_hybrid_edge_delta']}; Brier {m['hybrid_mean_brier_delta']:.6f}; harm rate {m['promoted_large_harm_rate']:.3f}; retention vs frozen S46 {s['improvement_retained_vs_s46']:.3f}.",f"Heteroskedastic cell: coverage {m['by_regime']['heteroskedastic']['coverage']:.3f}, edge {m['by_regime']['heteroskedastic']['hybrid_mean_edge_delta']:.6f}, harm {m['by_regime']['heteroskedastic']['large_harm_rate']:.3f}.",f"Frozen S46 comparison edge delta {b['hybrid_mean_edge_delta']:.6f}."]
          lines += ['','## Next',rationale]; Path('EXP-002S48_EVALUATION.md').write_text('\n'.join(lines))
          PY
          git add EXP-002S48_EVALUATION.md ../swarmite-queue/QUEUE.json
          git commit -m 'Evaluate EXP-002S48 and enqueue successor'
          git push
